global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "victoria-agent"
    static_configs:
      - targets: ["victoria-agent:8000"]
    metrics_path: "/metrics"
    scrape_interval: 30s

  - job_name: "veronica-agent"
    static_configs:
      - targets: ["veronica-agent:8000"]
    metrics_path: "/metrics"
    scrape_interval: 30s

  - job_name: "knowledge-rest"
    static_configs:
      - targets: ["knowledge_rest:8002"]
    metrics_path: "/metrics"
    scrape_interval: 30s

  - job_name: "expert-workers"
    static_configs:
      - targets:
          - "expert-worker-heavy:8001"
          - "expert-worker-anna:8001"
          - "expert-worker-victoria:8001"
          - "expert-worker-dynamic-1:8001"
          - "expert-worker-dynamic-2:8001"
    metrics_path: "/metrics"
    scrape_interval: 30s

  - job_name: "smart-worker"
    static_configs:
      - targets: ["knowledge_os_worker:8002"]
    metrics_path: "/metrics"
    scrape_interval: 30s

  - job_name: "orchestrator"
    static_configs:
      - targets: ["knowledge_os_orchestrator:8000"]
    metrics_path: "/metrics"
    scrape_interval: 30s

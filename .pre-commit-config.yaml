# Pre-commit hooks configuration
# Based on FastAPI and Element Plus best practices
# See https://pre-commit.com for more information

repos:
  # Built-in pre-commit hooks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
        args: ["--maxkb=5000"] # Block files > 5MB (except model files)
        exclude: ^(fused_model|training_data|knowledge_os/ai_learning_data)/
      - id: check-toml
      - id: check-yaml
        args: [--unsafe] # Allow custom YAML tags
      - id: check-json
      - id: end-of-file-fixer
      - id: trailing-whitespace
        exclude: \.(md|lock)$
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: mixed-line-ending

  # Python: Ruff (linting + formatting)
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.9.1
    hooks:
      # Linter (replaces flake8, isort, pyupgrade)
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
        files: ^(backend/app/(routers/chat|routers/expert_dialogue|services/victoria|utils/victoria_response_guard|tests/test_expert_dialogue_lightweight)\.py|knowledge_os/app/(ai_core|local_router|redis_manager|event_bus|meta_architect|safety_verifier|expert_council_discussion|multi_agent_debate|browser_operator|model_performance_probe|strategy_session_manager)\.py|knowledge_os/tests/(test_ollama_keep_alive_policy|test_local_router|test_redis_manager_metrics)\.py|src/database/auto_execution\.py)$
      # Formatter (replaces black)
      - id: ruff-format
        files: ^(backend/app/(routers/chat|routers/expert_dialogue|services/victoria|utils/victoria_response_guard|tests/test_expert_dialogue_lightweight)\.py|knowledge_os/app/(ai_core|local_router|redis_manager|event_bus|meta_architect|safety_verifier|expert_council_discussion|multi_agent_debate|browser_operator|model_performance_probe|strategy_session_manager)\.py|knowledge_os/tests/(test_ollama_keep_alive_policy|test_local_router|test_redis_manager_metrics)\.py|src/database/auto_execution\.py)$

  # Python: Type checking (mypy) - only for critical paths
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.14.0
    hooks:
      - id: mypy
        args:
          [
            --ignore-missing-imports,
            --follow-imports=skip,
            --explicit-package-bases,
            --python-version=3.11,
            --disable-error-code=import-untyped,
          ]
        files: ^(backend/app/(routers/chat|routers/expert_dialogue|services/victoria|utils/victoria_response_guard)\.py)$
        additional_dependencies:
          [pydantic, fastapi, types-redis, types-cachetools, types-aiofiles]

  # Rust: Format check (rustfmt)
  - repo: https://github.com/doublify/pre-commit-rust
    rev: v1.0
    hooks:
      - id: fmt
        args: ["--manifest-path", "Cargo.toml", "--all", "--"]
      - id: clippy
        args:
          [
            "--manifest-path",
            "Cargo.toml",
            "--all-targets",
            "--",
            "-D",
            "warnings",
          ]

  # JavaScript/TypeScript: Prettier
  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v4.0.0-alpha.8
    hooks:
      - id: prettier
        files: \.(js|ts|jsx|tsx|json|css|scss|md|yml|yaml)$
        exclude: ^(node_modules|dist|target|\.venv|fused_model|training_data)/

  # Security: Check for secrets
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: ["--baseline", ".secrets.baseline"]
        files: ^(backend/app/(routers/chat|routers/expert_dialogue|services/victoria|utils/victoria_response_guard)\.py|knowledge_os/app/(ai_core|local_router|redis_manager|event_bus|meta_architect|safety_verifier)\.py|rust_core/gateway/src/main.rs)$
        exclude: ^(fused_model|training_data|\.secrets\.baseline)$

# Global excludes
exclude: |
  (?x)^(
  audit_curl_err\.txt|
  data/lancedb/.*|
    fused_model/.*|
    training_data/.*|
    knowledge_os/ai_learning_data/.*|
    .*\.lock$|
    .*\.log$|
    node_modules/.*|
    target/.*|
    dist/.*|
    \.venv/.*
  )$

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "atra-web-ide"
version = "0.1.0"
description = "ATRA Web IDE - Browser-based IDE for AI Corporation Singularity 31.2+"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "ATRA Team"}
]
keywords = ["ai", "ide", "web", "development", "automation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.0",
    "mypy>=1.0",
    "ruff>=0.1.0",
]

[tool.setuptools]
packages = [
    "scripts",
    "scripts.utils",
    "knowledge_os",
    "knowledge_os.app",
    "backend",
    "backend.app",
    "src",
    "src.agents",
]

[tool.setuptools.package-data]
"*" = ["*.md", "*.txt", "*.yaml", "*.yml", "*.json"]

[tool.black]
line-length = 100
target-version = ['py39', 'py310', 'py311', 'py312']
include = '\.pyi?$'

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
# CI runs `mypy backend/app` from repo root. Gate the named targets honestly;
# imported monoliths (victoria_server, knowledge_os) stay silent until their own jobs.
explicit_package_bases = true
follow_imports = "silent"

# Residual annotation debt in backend.app (2026-11-20: 6 modules after clearing ollama, reranking, validation_pipeline).

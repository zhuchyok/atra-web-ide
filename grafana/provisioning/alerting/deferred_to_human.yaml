# Алерт: очередь на ручную проверку (deferred_to_human) > 10
# PROJECT_GAPS §3, CHANGES_FROM_OTHER_CHATS §0.4a
# Требует: Prometheus скрапит knowledge_rest:8002/metrics (добавить в prometheus.yml при необходимости)

apiVersion: 1

groups:
  - orgId: 1
    name: knowledge_os_alerts
    folder: Web IDE
    interval: 60s
    rules:
      - uid: deferred-to-human-high
        title: Deferred to human queue high
        condition: B
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange:
              from: 300
              to: 0
            model:
              expr: knowledge_os_tasks_deferred_new_24h_total
              refId: A
          - refId: C
            datasourceUid: __expr__
            relativeTimeRange:
              from: 300
              to: 0
            model:
              type: reduce
              expression: "$A"
              reducer: last
              refId: C
          - refId: B
            datasourceUid: __expr__
            relativeTimeRange:
              from: 300
              to: 0
            model:
              type: math
              expression: "$C > 10"
              refId: B
        noDataState: OK
        execErrState: Error
        for: 5m
        dashboardUid: knowledge_os-tasks
        panelId: 1
        annotations:
          summary: "Новые эскалации к человеку за 24ч > 10"
          description: "knowledge_os_tasks_deferred_new_24h_total > 10 более 5 минут. Проверьте дашборд Knowledge OS — задачи и last_error."

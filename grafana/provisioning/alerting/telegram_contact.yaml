# Telegram contact point для Grafana срабатывающих алертов.
# Отправляет в чат пользователя черезExisting бот (TELEGRAM_BOT_TOKEN из .env).
apiVersion: 1

contactPoints:
  - orgId: 1
    name: telegram
    receivers:
      - uid: telegram-receiver
        type: telegram
        disableResolveMessage: false
        settings:
          bottoken: "8461566302:AAFdSGcVzyEQG1UMu2s954DMJk-wzN7R3Hs"
          chatid: "556251171"

policies:
  - orgId: 1
    receiver: telegram
    group_by:
      - grafana_folder
      - alertname
    group_wait: 30s
    group_interval: 5m
    repeat_interval: 4h
    routes: []

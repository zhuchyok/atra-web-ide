# Grafana provisioning: Prometheus (порядок важен — datasources до alerting)
apiVersion: 1

datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://atra-web-ide-prometheus:9090
    isDefault: true
    editable: false
    version: 3
  - name: Grafana
    uid: grafana
    type: alertmanager
    access: proxy
    orgId: 1
    url: http://localhost:3000
    jsonData:
      implementation: prometheus

# Legacy monitoring (duplicate of atra-web-ide-prometheus:9091 / grafana:3002).
# Default compose up does not start these (profile legacy-monitoring).
# Rollback: docker compose --profile legacy-monitoring -f docker-compose.yml up -d
# Volumes kept. Live alerts: knowledge_rest:8002 → 9091 → com.atra.tg-deferred-alerts.

services:
  prometheus:
    image: prom/prometheus:latest
    container_name: atra-prometheus
    mem_limit: 2g
    environment:
      TZ: Europe/Moscow
    ports:
      - "9092:9090"
    volumes:
      - ../prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - ../prometheus/alerts.yml:/etc/prometheus/alerts.yml
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=30d"
    networks:
      - atra-network
    profiles: ["legacy-monitoring"]
    restart: "no"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3

  grafana:
    image: grafana/grafana:latest
    container_name: atra-grafana
    mem_limit: 512m
    ports:
      - "3001:3000"
    environment:
      - TZ=Europe/Moscow
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-atra2025}
      - GF_SERVER_ROOT_URL=http://localhost:3001
    volumes:
      - grafana_data:/var/lib/grafana
      - ../grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ../grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ../grafana/dashboards:/var/lib/grafana/dashboards:ro
    networks:
      - atra-network
    depends_on:
      - prometheus
    profiles: ["legacy-monitoring"]
    restart: "no"
    # v131: ensure Healthcheck is applied (older creates had Healthcheck=null → docker ps without healthy)
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:3000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
    container_name: atra-elasticsearch
    profiles: ["legacy-monitoring"]
    restart: "no"
    mem_limit: 2g
    environment:
      - TZ=Europe/Moscow
      - discovery.type=single-node
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
      - xpack.security.enabled=false
    ports:
      - "9200:9200"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    networks:
      - atra-network
    healthcheck:
      test:
        ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5

  kibana:
    image: docker.elastic.co/kibana/kibana:8.11.0
    container_name: atra-kibana
    mem_limit: 1g
    ports:
      - "5601:5601"
    environment:
      - TZ=Europe/Moscow
      - ELASTICSEARCH_HOSTS=http://atra-elasticsearch:9200
      - xpack.security.enabled=false
    networks:
      - atra-network
    depends_on:
      elasticsearch:
        condition: service_healthy
    profiles: ["legacy-monitoring"]
    restart: "no"

networks:
  atra-network:
    external: true

volumes:
  prometheus_data:
  grafana_data:
  elasticsearch_data:

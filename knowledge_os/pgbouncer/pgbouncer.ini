[databases]
knowledge_os = host=knowledge_postgres port=5432 dbname=knowledge_os

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432

; auth_query: PgBouncer спрашивает Postgres за паролем — работает со scram-sha-256 (PG16)
auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt
auth_query = SELECT usename, passwd FROM pg_shadow WHERE usename=$1
auth_dbname = knowledge_os

; Transaction pooling — соединение возвращается в пул после каждой транзакции.
; Несовместимо с LISTEN/NOTIFY (employees_sync_daemon идёт напрямую на postgres:5432).
pool_mode = transaction

; Клиентских соединений принимаем до 1000
max_client_conn = 1000

; Реальных соединений к Postgres — 20 достаточно для 37 контейнеров
default_pool_size = 20
min_pool_size = 5
reserve_pool_size = 5
reserve_pool_timeout = 3

; Закрывать idle server-соединения через 5 мин
server_idle_timeout = 300

; Логировать только ошибки
log_connections = 0
log_disconnections = 0
log_pooler_errors = 1

stats_period = 60

use_default_settings: true

general:
  instance_name: "ATRA SearXNG"
  debug: false
  privacypolicy_url: false
  donation_url: false
  contact_url: false
  enable_metrics: true

server:
  port: 8080
  bind_address: "0.0.0.0"
  secret_key: "atra-searxng-secret-2026-singularity"
  base_url: false
  image_proxy: false
  default_http_headers:
    X-Content-Type-Options: nosniff
    X-Download-Options: noopen
    X-Robots-Tag: noindex, nofollow

ui:
  static_use_hash: false
  default_locale: "ru"
  default_theme: simple
  theme_args:
    simple_style: auto
  infinite_scroll: false
  center_alignment: false
  query_in_title: false
  results_on_new_tab: false
  advanced_search: false

search:
  safe_search: 0
  autocomplete: ""
  autocomplete_min: 4
  default_lang: "ru-RU"
  ban_time_on_fail: 5
  max_ban_time_on_fail: 120
  formats:
    - html
    - json

engines:
  - name: google
    engine: google
    shortcut: g
    url: https://www.google.com
    use_mobile_ui: false
    disabled: false

  - name: bing
    engine: bing
    shortcut: b
    disabled: false

  - name: duckduckgo
    engine: duckduckgo
    shortcut: d
    disabled: false

  - name: wikipedia
    engine: wikipedia
    shortcut: wp
    display_error_messages: true

  - name: wikidata
    engine: wikidata
    shortcut: wd
    timeout: 3.0

outgoing:
  request_timeout: 3.0
  max_request_timeout: 15.0
  useragent_suffix: ""
  pool_connections: 100
  pool_maxsize: 20
  enable_http2: true

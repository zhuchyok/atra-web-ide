# Agents and Workers Stack for Singularity 31.2
# Usage: docker-compose -f docker-compose.yml -f docker-compose.agents.yml up -d

x-dynamic-worker-env: &dynamic-worker-env
  TZ: Europe/Moscow
  EXPERT_STREAM_DEDICATED: ${EXPERT_STREAM_DEDICATED:-true}
  ENABLE_METRICS: "true"
  METRICS_PORT: "8001"
  DATABASE_URL: postgresql://admin:${POSTGRES_PASSWORD:-changeme}@knowledge_pgbouncer:6432/knowledge_os
  REDIS_URL: unix:///data/redis/redis.sock
  OLLAMA_BASE_URL: http://host.docker.internal:11434
  OLLAMA_EXECUTOR_BASE_URL: ${OLLAMA_EXECUTOR_BASE_URL:-http://host.docker.internal:11434}
  OLLAMA_NUM_PARALLEL: "5"
  OLLAMA_GLOBAL_MAX_SLOTS: "4"
  OLLAMA_MAX_QUEUE: "100"
  USE_CUBE_SANDBOX: "false"
  HITL_ENFORCE_HIGH_RISK_TASKS: "true"
  HITL_HIGH_RISK_LEVELS: "critical"
  HITL_APPROVAL_TIMEOUT_SEC: "180"
  HOST_PROJECT_ROOT: ${HOST_PROJECT_ROOT:-}
  HOST_SANDBOX_SHARED_DIR: ${HOST_SANDBOX_SHARED_DIR:-}

# HOST_PROJECT_ROOT required when recreate runs via docker.sock from orchestrator
x-dynamic-worker-volumes: &dynamic-worker-volumes
  - ${HOST_PROJECT_ROOT:-..}/data:/app/data
  - ${HOST_PROJECT_ROOT:-..}/knowledge_os:/app/knowledge_os
  - redis_data:/data/redis

x-dynamic-worker-defaults: &dynamic-worker-defaults
  build:
    context: ..
    dockerfile: infrastructure/docker/agents/Dockerfile
  restart: unless-stopped
  networks:
    - atra-network
  healthcheck:
    test: ["CMD-SHELL", "grep -a -q expert_worker.py /proc/1/cmdline"]
    interval: 30s
    timeout: 10s
    retries: 3
  extra_hosts:
    - "host.docker.internal:host-gateway"
  command: python3 knowledge_os/app/expert_worker.py

services:
  quality-service:
    build:
      context: app
      dockerfile: Dockerfile.quality
    container_name: quality-service
    restart: unless-stopped
    ports:
      - "8003:8003"
    networks:
      - atra-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8003/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  docker-proxy:
    build:
      context: ../infrastructure/docker/docker-proxy
      dockerfile: Dockerfile
    container_name: docker-proxy
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "2376:2376"
    networks:
      - atra-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:2376/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    environment:
      DOCKER_PROXY_RATE_LIMIT: "120"
      DOCKER_PROXY_AUDIT_LOG: "/var/log/docker-proxy-audit.jsonl"

  victoria-agent:
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    build:
      context: ..
      dockerfile: infrastructure/docker/agents/Dockerfile
    container_name: victoria-agent
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 8G
        reservations:
          memory: 4G
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 60s
      timeout: 60s
      retries: 10
      start_period: 180s
    user: root
    networks:
      - atra-network
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      TZ: Europe/Moscow
      CORPORATION_TZ: Europe/Moscow
      PYTHONPATH: /app/knowledge_os/app:/app/knowledge_os:/app
      VICTORIA_PORT: "8000"
      ATRA_HOST_WORKSPACE: ${ATRA_HOST_WORKSPACE:-${PWD}/..}
      ATRA_CONTAINER_WORKSPACE: /workspace/atra-web-ide
      PROJECT_ROOT: /workspace/atra-web-ide
      WORKSPACE_ROOT: /workspace/atra-web-ide
      ATRA_ENV: prod
      DATABASE_URL: postgresql://admin:${POSTGRES_PASSWORD:-changeme}@knowledge_pgbouncer:6432/knowledge_os
      POSTGRES_DIRECT_URL: postgresql://admin:${POSTGRES_PASSWORD:-changeme}@knowledge_postgres:5432/knowledge_os
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      # Выделенный coder-инстанс для autonomous-code (обход ReAct)
      OLLAMA_CODER_URL: http://host.docker.internal:11436
      # Optional dedicated endpoint/queue for heavy executor model (qwen3-coder)
      OLLAMA_EXECUTOR_BASE_URL: ${OLLAMA_EXECUTOR_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_NUM_PARALLEL: "5"
      OLLAMA_GLOBAL_MAX_SLOTS: "4"
      OLLAMA_MAX_QUEUE: "100"
      REDIS_URL: unix:///data/redis/redis.sock
      # Планировщику нужны длинные JSON-планы (default 280 обрезает ответы)
      DIALOGUE_MAX_TOKENS: ${DIALOGUE_MAX_TOKENS:-1500}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      CHAT_ID: ${TELEGRAM_USER_ID}
      GH_TOKEN: ${GH_TOKEN}
      VERONICA_URL: http://veronica-agent:8000
      USE_VICTORIA_ENHANCED: "true"
      VICTORIA_STALE_TASK_TIMEOUT_SEC: "4200"
      VICTORIA_SWARM_GATHER_TIMEOUT_SEC: "1200"
      VICTORIA_FORCE_ENHANCED_OPERATIONAL: "true"
      VICTORIA_ENHANCED_SOLVE_TIMEOUT_SEC: "1800"
      VICTORIA_ENHANCED_SOLVE_TIMEOUT_OPERATIONAL_SEC: "1200"
      VICTORIA_ENHANCED_LLM_TIMEOUT_SEC: "1200"
      VICTORIA_ENHANCED_LLM_TIMEOUT_OPERATIONAL_SEC: "1200"
      ORCHESTRATION_V2_ENABLED: "true"
      ORCHESTRATION_V2_PERCENTAGE: "10"
      EXECUTE_ASSIGNMENTS_IN_RUN: "true"
      PREFER_EXPERTS_FIRST: "true"
      RAG_RERANKER_ENABLED: "false"
      OLLAMA_EMBED_TIMEOUT_SEC: "8"
      OLLAMA_EMBED_MAX_RETRIES: "2"
      MLX_BASE_URL: http://host.docker.internal:11435
      # v135: brain on MLX (world practice); Ollama = hands/light/embed
      VICTORIA_MLX_BRAIN: ${VICTORIA_MLX_BRAIN:-true}
      VICTORIA_WISDOM_MLX_PRIMARY: ${VICTORIA_WISDOM_MLX_PRIMARY:-true}
      USE_MLX_FOR_PLANNER: ${USE_MLX_FOR_PLANNER:-true}
      USE_MLX_FALLBACK: ${USE_MLX_FALLBACK:-true}
      HOST_PROJECT_ROOT: ${HOST_PROJECT_ROOT:-}
      HOST_SANDBOX_SHARED_DIR: ${HOST_SANDBOX_SHARED_DIR:-}
      VICTORIA_STRATEGIST_MODEL: ${VICTORIA_STRATEGIST_MODEL:-victoria-wisdom-24k:latest}
      VICTORIA_EXECUTOR_MODEL: ${VICTORIA_EXECUTOR_MODEL:-victoria-wisdom-24k:latest}
      VICTORIA_WARMUP_ENABLED: ${VICTORIA_WARMUP_ENABLED:-true}
      VICTORIA_WARMUP_BLOCK_STARTUP: ${VICTORIA_WARMUP_BLOCK_STARTUP:-true}
      VICTORIA_WARMUP_TIMEOUT_PER_MODEL: ${VICTORIA_WARMUP_TIMEOUT_PER_MODEL:-180}
      VICTORIA_WARMUP_RETRY_COUNT: ${VICTORIA_WARMUP_RETRY_COUNT:-8}
      VICTORIA_WARMUP_RETRY_SLEEP_SEC: ${VICTORIA_WARMUP_RETRY_SLEEP_SEC:-4}
      VICTORIA_SYNC_SAFE_TIMEOUT_SEC: "20"
      VICTORIA_SYNC_SAFE_MODEL: ${VICTORIA_SYNC_SAFE_MODEL:-victoria-wisdom-24k:latest}
      VICTORIA_TIMEOUT_FALLBACK_MODEL: ${VICTORIA_TIMEOUT_FALLBACK_MODEL:-victoria-wisdom-24k:latest}
      VICTORIA_SEMAPHORE_ACQUIRE_TIMEOUT_SEC: "2"
      UVICORN_WORKERS: "2"
      UVICORN_TIMEOUT_KEEP_ALIVE: "75"
      DOCKER_HOST: "http://docker-proxy:2376"
    ports:
      - "8010:8000"
    volumes:
      - ../data:/app/data
      - ../logs:/app/logs
      - ../src:/app/src
      - ../knowledge_os:/app/knowledge_os
      - ..:/workspace/atra-web-ide
      - redis_data:/data/redis
    command: python -m src.agents.bridge.victoria_server

  veronica-agent:
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    build:
      context: ..
      dockerfile: infrastructure/docker/agents/Dockerfile
    container_name: veronica-agent
    restart: always
    networks:
      - atra-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    environment:
      TZ: Europe/Moscow
      PYTHONPATH: /app/knowledge_os/app:/app/knowledge_os:/app
      DATABASE_URL: postgresql://admin:${POSTGRES_PASSWORD:-changeme}@knowledge_pgbouncer:6432/knowledge_os
      REDIS_URL: unix:///data/redis/redis.sock
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      # Выделенный Ollama-инстанс для coder (11436) — не конкурирует с wisdom Victoria
      OLLAMA_EXECUTOR_BASE_URL: http://host.docker.internal:11436
      GH_TOKEN: ${GH_TOKEN}
      OLLAMA_NUM_PARALLEL: "5"
      OLLAMA_GLOBAL_MAX_SLOTS: "4"
      OLLAMA_MAX_QUEUE: "100"
      # [REGRESSION] wisdom (24k/32k) в ReAct-цикле уходит в CoT-rambling вместо JSON-акции.
      # Coding-модель согласно developer_forced назначению оркестратора.
      # 32b не установлен в Ollama (fallback на wisdom по сканеру) — используем 14b.
      VERONICA_MODEL: ${VERONICA_MODEL:-qwen3-coder:30b}
      # Workspace mapping: относительные пути write_file заносим в смонтированный проект
      ATRA_CONTAINER_WORKSPACE: /app
      ATRA_HOST_WORKSPACE: ${HOST_PROJECT_ROOT:-/Users/bikos/Documents/atra-web-ide}
    volumes:
      - ../data:/app/data
      - ../logs:/app/logs
      - ../src:/app/src
      - ../knowledge_os:/app/knowledge_os
      - redis_data:/data/redis
    command: python -m src.agents.bridge.server

  knowledge_os_orchestrator:
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 2G
    build:
      context: ..
      dockerfile: infrastructure/docker/agents/Dockerfile
    container_name: knowledge_os_orchestrator
    restart: unless-stopped
    networks:
      - atra-network
    healthcheck:
      test: ["CMD-SHELL", "grep -a -q enhanced_orchestrator.py /proc/1/cmdline"]
      interval: 30s
      timeout: 10s
      retries: 3
    environment:
      TZ: Europe/Moscow
      PYTHONPATH: /app/knowledge_os/app:/app/knowledge_os
      DATABASE_URL: postgresql://admin:${POSTGRES_PASSWORD:-changeme}@knowledge_pgbouncer:6432/knowledge_os
      REDIS_URL: unix:///data/redis/redis.sock
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      OLLAMA_EXECUTOR_BASE_URL: ${OLLAMA_EXECUTOR_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_NUM_PARALLEL: "5"
      OLLAMA_GLOBAL_MAX_SLOTS: "4"
      OLLAMA_MAX_QUEUE: "100"
      ORCHESTRATOR_BACKLOG_THRESHOLD: ${ORCHESTRATOR_BACKLOG_THRESHOLD:-20}
      ORCHESTRATOR_CONTRACT_ROLLOUT_MODE: "auto"
      ORCHESTRATOR_CONTRACT_CANARY_PERCENT: "20"
      ORCHESTRATOR_ROLLOUT_KPI_WINDOW_MIN: "10"
      # Per-expert Redis streams (rollback: set to "false" for legacy shared expert_tasks)
      EXPERT_STREAM_DEDICATED: ${EXPERT_STREAM_DEDICATED:-true}
      KNOWLEDGE_INGEST_BACKPRESSURE_ENABLED: ${KNOWLEDGE_INGEST_BACKPRESSURE_ENABLED:-true}
      KNOWLEDGE_INGEST_HIGH_WATERMARK: ${KNOWLEDGE_INGEST_HIGH_WATERMARK:-24}
      KNOWLEDGE_INGEST_FORCE_ALLOW: ${KNOWLEDGE_INGEST_FORCE_ALLOW:-false}
      BRIDGE_CERT_PATH: /certs/mac-studio.crt
      BRIDGE_KEY_PATH: /certs/mac-studio.key
      BRIDGE_CA_PATH: /certs/ca.crt
      ENABLE_METRICS: "true"
      METRICS_PORT: "8000"
      SEMANTIC_CACHE_ENFORCE_FRESHNESS: ${SEMANTIC_CACHE_ENFORCE_FRESHNESS:-true}
      SEMANTIC_CACHE_FRESHNESS_SLA_SEC: ${SEMANTIC_CACHE_FRESHNESS_SLA_SEC:-900}
      VICTORIA_STRATEGIST_MODEL: ${VICTORIA_STRATEGIST_MODEL:-victoria-wisdom-24k:latest}
      VICTORIA_EXECUTOR_MODEL: ${VICTORIA_EXECUTOR_MODEL:-victoria-wisdom-24k:latest}
      # Mac Docker Desktop: absolute host binds when orchestrator recreates dynamic workers
      HOST_PROJECT_ROOT: ${HOST_PROJECT_ROOT:-}
      HOST_SANDBOX_SHARED_DIR: ${HOST_SANDBOX_SHARED_DIR:-}
      DOCKER_HOST: "http://docker-proxy:2376"
    volumes:
      - ../knowledge_os:/app/knowledge_os
      - ../certs:/certs:ro
      - redis_data:/data/redis
    working_dir: /app/knowledge_os/app
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command:
      ["python", "enhanced_orchestrator.py", "--continuous", "--interval", "60"]

  expert-worker-heavy:
    depends_on:
      victoria-agent:
        condition: service_started
      redis:
        condition: service_healthy
    build:
      context: ..
      dockerfile: infrastructure/docker/agents/Dockerfile
    restart: always
    networks:
      - atra-network
    healthcheck:
      test: ["CMD-SHELL", "grep -a -q expert_worker.py /proc/1/cmdline"]
      interval: 30s
      timeout: 10s
      retries: 3
    environment:
      TZ: Europe/Moscow
      EXPERT_NAME: "Роман"
      ENABLE_METRICS: "true"
      EXPERT_STREAM_DEDICATED: ${EXPERT_STREAM_DEDICATED:-true}
      METRICS_PORT: "8001"
      DATABASE_URL: postgresql://admin:${POSTGRES_PASSWORD:-changeme}@knowledge_pgbouncer:6432/knowledge_os
      REDIS_URL: unix:///data/redis/redis.sock
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      OLLAMA_EXECUTOR_BASE_URL: ${OLLAMA_EXECUTOR_BASE_URL:-http://host.docker.internal:11434}
      VICTORIA_EXECUTOR_MODEL: ${VICTORIA_EXECUTOR_MODEL:-victoria-wisdom-24k:latest}
      OLLAMA_NUM_PARALLEL: "5"
      OLLAMA_GLOBAL_MAX_SLOTS: "4"
      OLLAMA_MAX_QUEUE: "100"
      USE_CUBE_SANDBOX: "false"
      SMART_WORKER_HARD_INPROGRESS_TIMEOUT_MINUTES: ${SMART_WORKER_HARD_INPROGRESS_TIMEOUT_MINUTES:-10}
      SMART_WORKER_BACKLOG_HARD_INPROGRESS_TIMEOUT_MINUTES: ${SMART_WORKER_BACKLOG_HARD_INPROGRESS_TIMEOUT_MINUTES:-10}
      SMART_WORKER_HARD_CAP_MAX_RESETS: ${SMART_WORKER_HARD_CAP_MAX_RESETS:-2}
      BLACKBOARD_ENFORCE_TARGET_EXPERT: "true"
      HITL_ENFORCE_HIGH_RISK_TASKS: "true"
      HITL_HIGH_RISK_LEVELS: "critical"
      HITL_APPROVAL_TIMEOUT_SEC: "180"
    volumes:
      - ../data:/app/data
      - ../knowledge_os:/app/knowledge_os
      - redis_data:/data/redis
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: python3 knowledge_os/app/expert_worker.py

  expert-worker-anna:
    depends_on:
      victoria-agent:
        condition: service_started
      redis:
        condition: service_healthy
    build:
      context: ..
      dockerfile: infrastructure/docker/agents/Dockerfile
    restart: always
    networks:
      - atra-network
    healthcheck:
      test: ["CMD-SHELL", "grep -a -q expert_worker.py /proc/1/cmdline"]
      interval: 30s
      timeout: 10s
      retries: 3
    environment:
      TZ: Europe/Moscow
      EXPERT_NAME: "Анна"
      ENABLE_METRICS: "true"
      EXPERT_STREAM_DEDICATED: ${EXPERT_STREAM_DEDICATED:-true}
      METRICS_PORT: "8001"
      DATABASE_URL: postgresql://admin:${POSTGRES_PASSWORD:-changeme}@knowledge_pgbouncer:6432/knowledge_os
      REDIS_URL: unix:///data/redis/redis.sock
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      OLLAMA_EXECUTOR_BASE_URL: ${OLLAMA_EXECUTOR_BASE_URL:-http://host.docker.internal:11434}
      VICTORIA_EXECUTOR_MODEL: ${VICTORIA_EXECUTOR_MODEL:-victoria-wisdom-24k:latest}
      OLLAMA_NUM_PARALLEL: "5"
      OLLAMA_GLOBAL_MAX_SLOTS: "4"
      OLLAMA_MAX_QUEUE: "100"
      USE_CUBE_SANDBOX: "false"
      BLACKBOARD_ENFORCE_TARGET_EXPERT: "true"
      HITL_ENFORCE_HIGH_RISK_TASKS: "true"
      HITL_HIGH_RISK_LEVELS: "critical"
      HITL_APPROVAL_TIMEOUT_SEC: "180"
    volumes:
      - ../data:/app/data
      - ../knowledge_os:/app/knowledge_os
      - redis_data:/data/redis
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: python3 knowledge_os/app/expert_worker.py

  expert-worker-victoria:
    depends_on:
      victoria-agent:
        condition: service_started
      redis:
        condition: service_healthy
    build:
      context: ..
      dockerfile: infrastructure/docker/agents/Dockerfile
    restart: always
    mem_limit: 5g
    networks:
      - atra-network
    healthcheck:
      test: ["CMD-SHELL", "grep -a -q expert_worker.py /proc/1/cmdline"]
      interval: 30s
      timeout: 10s
      retries: 3
    environment:
      TZ: Europe/Moscow
      EXPERT_NAME: "Виктория"
      ENABLE_METRICS: "true"
      EXPERT_STREAM_DEDICATED: ${EXPERT_STREAM_DEDICATED:-true}
      METRICS_PORT: "8001"
      DATABASE_URL: postgresql://admin:${POSTGRES_PASSWORD:-changeme}@knowledge_pgbouncer:6432/knowledge_os
      REDIS_URL: unix:///data/redis/redis.sock
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      OLLAMA_EXECUTOR_BASE_URL: ${OLLAMA_EXECUTOR_BASE_URL:-http://host.docker.internal:11434}
      VICTORIA_EXECUTOR_MODEL: ${VICTORIA_EXECUTOR_MODEL:-victoria-wisdom-24k:latest}
      OLLAMA_NUM_PARALLEL: "5"
      OLLAMA_GLOBAL_MAX_SLOTS: "4"
      OLLAMA_MAX_QUEUE: "100"
      USE_CUBE_SANDBOX: "false"
      BLACKBOARD_ENFORCE_TARGET_EXPERT: "true"
      HITL_ENFORCE_HIGH_RISK_TASKS: "true"
      HITL_HIGH_RISK_LEVELS: "critical"
      HITL_APPROVAL_TIMEOUT_SEC: "180"
    volumes:
      - ../data:/app/data
      - ../knowledge_os:/app/knowledge_os
      - redis_data:/data/redis
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: python3 knowledge_os/app/expert_worker.py

  expert-worker-dynamic-1:
    depends_on:
      victoria-agent:
        condition: service_started
      redis:
        condition: service_healthy
    <<: *dynamic-worker-defaults
    environment:
      <<: *dynamic-worker-env
      EXPERT_NAME: ${DYNAMIC_EXPERT_NAME_SLOT1:-Инна}
    volumes: *dynamic-worker-volumes

  expert-worker-dynamic-2:
    depends_on:
      victoria-agent:
        condition: service_started
      redis:
        condition: service_healthy
    <<: *dynamic-worker-defaults
    environment:
      <<: *dynamic-worker-env
      EXPERT_NAME: ${DYNAMIC_EXPERT_NAME_SLOT2:-Юлия}
    volumes: *dynamic-worker-volumes

  # [SCALE] Слоты 3-5: горизонтальное масштабирование overflow-пула.
  # EXPERT_NAME из overflow (Инна/Юлия) — все приходят на stream:expert_tasks:overflow.
  expert-worker-dynamic-3:
    depends_on:
      victoria-agent:
        condition: service_started
      redis:
        condition: service_healthy
    <<: *dynamic-worker-defaults
    environment:
      <<: *dynamic-worker-env
      EXPERT_NAME: ${DYNAMIC_EXPERT_NAME_SLOT3:-Инна}
    volumes: *dynamic-worker-volumes

  expert-worker-dynamic-4:
    depends_on:
      victoria-agent:
        condition: service_started
      redis:
        condition: service_healthy
    <<: *dynamic-worker-defaults
    environment:
      <<: *dynamic-worker-env
      EXPERT_NAME: ${DYNAMIC_EXPERT_NAME_SLOT4:-Юлия}
    volumes: *dynamic-worker-volumes

  expert-worker-dynamic-5:
    depends_on:
      victoria-agent:
        condition: service_started
      redis:
        condition: service_healthy
    <<: *dynamic-worker-defaults
    environment:
      <<: *dynamic-worker-env
      EXPERT_NAME: ${DYNAMIC_EXPERT_NAME_SLOT5:-Инна}
    volumes: *dynamic-worker-volumes

  knowledge_os_worker:
    build:
      context: ..
      dockerfile: infrastructure/docker/agents/Dockerfile
    container_name: knowledge_os_worker
    restart: unless-stopped
    networks:
      - atra-network
    depends_on:
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        ["CMD-SHELL", "grep -a -q smart_worker_autonomous.py /proc/1/cmdline"]
      interval: 30s
      timeout: 10s
      retries: 3
    environment:
      TZ: Europe/Moscow
      PYTHONPATH: /app/knowledge_os/app:/app/knowledge_os
      DATABASE_URL: postgresql://admin:${POSTGRES_PASSWORD:-changeme}@knowledge_pgbouncer:6432/knowledge_os
      REDIS_URL: unix:///data/redis/redis.sock
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      OLLAMA_EXECUTOR_BASE_URL: ${OLLAMA_EXECUTOR_BASE_URL:-http://host.docker.internal:11434}
      VICTORIA_EXECUTOR_MODEL: ${VICTORIA_EXECUTOR_MODEL:-victoria-wisdom-24k:latest}
      MLX_BASE_URL: http://host.docker.internal:11435
      MLX_API_URL: http://host.docker.internal:11435
      OLLAMA_NUM_PARALLEL: "5"
      OLLAMA_GLOBAL_MAX_SLOTS: "4"
      OLLAMA_MAX_QUEUE: "100"
      USE_CUBE_SANDBOX: "false"
      ENABLE_METRICS: "true"
      METRICS_PORT: "8002"
      DOCKER_HOST: "http://docker-proxy:2376"
    volumes:
      - ../knowledge_os:/app/knowledge_os
      - redis_data:/data/redis
    working_dir: /app/knowledge_os/app
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: ["python", "smart_worker_autonomous.py"]

  knowledge_evolution:
    build:
      context: ..
      dockerfile: infrastructure/docker/agents/Dockerfile
    container_name: knowledge_evolution
    restart: unless-stopped
    mem_limit: 3g
    networks:
      - atra-network
    healthcheck:
      test: ["CMD-SHELL", "grep -a -q run_evolution_loop.py /proc/1/cmdline"]
      interval: 60s
      timeout: 10s
      retries: 3
    environment:
      TZ: Europe/Moscow

    environment:
      TZ: Europe/Moscow
      PYTHONPATH: /app/knowledge_os/app:/app/knowledge_os
      DATABASE_URL: postgresql://admin:${POSTGRES_PASSWORD:-changeme}@knowledge_pgbouncer:6432/knowledge_os
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      CHAT_ID: ${TELEGRAM_USER_ID}
      NTFY_URL: ${NTFY_URL:-https://ntfy.sh/atra_victoria_curator}
      TG_PROXY: ${TG_PROXY_CONTAINER:-socks5h://host.docker.internal:1080}
      TG_FORCE_NTFY_PRIMARY: ${TG_FORCE_NTFY_PRIMARY:-true}
    volumes:
      - ../knowledge_os:/app/knowledge_os
    working_dir: /app/knowledge_os/app
    command: ["python", "-u", "telegram_notifications_worker.py"]

  performance-watchdog:
    build:
      context: ..
      dockerfile: infrastructure/docker/agents/Dockerfile
    container_name: performance-watchdog
    restart: unless-stopped
    mem_limit: 3g
    networks:
      - atra-network
    healthcheck:
      test: ["CMD-SHELL", "grep -a -q performance_watchdog.py /proc/1/cmdline"]
      interval: 60s
      timeout: 10s
      retries: 3
    environment:
      TZ: Europe/Moscow
      PYTHONPATH: /app/knowledge_os/app:/app/knowledge_os
      DATABASE_URL: postgresql://admin:${POSTGRES_PASSWORD:-changeme}@knowledge_pgbouncer:6432/knowledge_os
      REDIS_URL: unix:///data/redis/redis.sock
    volumes:
      - ../knowledge_os:/app/knowledge_os
      - redis_data:/data/redis
      - /var/run/docker.sock:/var/run/docker.sock
    working_dir: /app/knowledge_os/app
    command: ["python", "-u", "performance_watchdog.py"]

  board-scheduler:
    build:
      context: ..
      dockerfile: infrastructure/docker/agents/Dockerfile
    container_name: board-scheduler
    restart: unless-stopped
    networks:
      - atra-network
    healthcheck:
      test: ["CMD-SHELL", "grep -a -q board_scheduler.py /proc/1/cmdline"]
      interval: 60s
      timeout: 10s
      retries: 3
    environment:
      TZ: Europe/Moscow
      PYTHONPATH: /app/knowledge_os/app:/app/knowledge_os
      DATABASE_URL: postgresql://admin:${POSTGRES_PASSWORD:-changeme}@knowledge_pgbouncer:6432/knowledge_os
    volumes:
      - ..:/app:ro
    working_dir: /app/knowledge_os/app
    command: ["python", "-u", "board_scheduler.py"]

  victoria-visual-search:
    build:
      context: ./app/visual_search
      dockerfile: Dockerfile
    container_name: victoria-visual-search
    restart: unless-stopped
    networks:
      - atra-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8005/health"]
      interval: 60s
      timeout: 10s
      retries: 3
    environment:
      TZ: Europe/Moscow
      PYTHONPATH: /app/knowledge_os/app:/app/knowledge_os:/app
      OLLAMA_BASE_URL: "http://host.docker.internal:11434"
    ports:
      - "8005:8005"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ../knowledge_os/models:/app/models
      - ../docs:/app/corpus/docs:ro
      - ../knowledge_os/app:/app/corpus/knowledge_os:ro

  swarm-studio:
    build:
      context: ..
      dockerfile: infrastructure/docker/agents/Dockerfile
    container_name: swarm-studio
    restart: unless-stopped
    ports:
      - "8006:8006"
    networks:
      - atra-network
    healthcheck:
      test: ["CMD-SHELL", "grep -a -q swarm_studio /proc/1/cmdline"]
      interval: 60s
      timeout: 10s
      retries: 3
    environment:
      TZ: Europe/Moscow
      PYTHONPATH: /app/knowledge_os/app:/app/knowledge_os
      DATABASE_URL: postgresql://admin:${POSTGRES_PASSWORD:-changeme}@knowledge_pgbouncer:6432/knowledge_os
      SWARM_STUDIO_PORT: "8006"
    volumes:
      - ../knowledge_os:/app/knowledge_os
    working_dir: /app/knowledge_os/app
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command:
      [
        "python",
        "-u",
        "-c",
        "import uvicorn; from swarm_studio import app; uvicorn.run(app, host='0.0.0.0', port=8006)",
      ]

networks:
  atra-network:
    external: true

volumes:
  redis_data:

        condition: service_healthy

  # Планировщик заседаний Совета Директоров: run_board_meeting() каждые 6 ч → директива в board_decisions и knowledge_nodes (дашборд «Решения Совета»)
  board-scheduler:
    build:
      context: ..
      dockerfile: infrastructure/docker/agents/Dockerfile
    container_name: board-scheduler
    restart: unless-stopped
    networks:
      - atra-network
    environment:
      TZ: Europe/Moscow
      PYTHONPATH: /app/knowledge_os
      DATABASE_URL: postgresql://admin:secret@knowledge_pgbouncer:6432/knowledge_os # pragma: allowlist secret
      POSTGRES_DIRECT_URL: postgresql://admin:secret@knowledge_postgres:5432/knowledge_os # pragma: allowlist secret
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      MLX_API_URL: http://host.docker.internal:11435
      SERVER_LLM_URL: http://host.docker.internal:11434
    volumes:
      - ..:/app:ro
    working_dir: /app/knowledge_os/app
    command: ["python", "-u", "board_scheduler.py"]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy

  # Streamlit дашборд корпорации (зависимости в образе, код монтируется)
  corporation-dashboard:
    build:
      context: .
      dockerfile: dashboard/Dockerfile.deps
    container_name: corporation-dashboard
    restart: unless-stopped
    networks:
      - atra-network
    ports:
      - "8501:8501"
    environment:
      TZ: Europe/Moscow
      # Если дашборд в Docker, а PostgreSQL на хосте: postgresql://admin:secret@host.docker.internal:5432/knowledge_os  # pragma: allowlist secret
      DATABASE_URL: ${DATABASE_URL:-postgresql://admin:secret@knowledge_pgbouncer:6432/knowledge_os} # pragma: allowlist secret
      POSTGRES_DIRECT_URL: ${POSTGRES_DIRECT_URL:-postgresql://admin:secret@knowledge_postgres:5432/knowledge_os} # pragma: allowlist secret
      # Чтобы singularity_9_ab_tester и evaluator загружались в контейнере
      PYTHONPATH: /app/project/knowledge_os/app
      # URL бэкенда для API песочниц (внутри Docker сети)
      BACKEND_URL: http://atra-web-ide-backend:8000
    volumes:
      - ..:/app/project:ro
      - /var/run/docker.sock:/var/run/docker.sock
    working_dir: /app/project/knowledge_os/dashboard
    command:
      [
        "python",
        "-m",
        "streamlit",
        "run",
        "app.py",
        "--server.port=8501",
        "--server.address=0.0.0.0",
        "--server.headless=true",
      ]

  # Stability & Performance Watchdog: Автономная оптимизация и Backpressure
  performance-watchdog:
    build:
      context: ..
      dockerfile: infrastructure/docker/agents/Dockerfile
    container_name: performance-watchdog
    restart: unless-stopped
    mem_limit: 1g
    networks:
      - atra-network
    environment:
      TZ: Europe/Moscow
      PYTHONPATH: /app/knowledge_os
      DATABASE_URL: postgresql://admin:secret@knowledge_pgbouncer:6432/knowledge_os # pragma: allowlist secret
      POSTGRES_DIRECT_URL: postgresql://admin:secret@knowledge_postgres:5432/knowledge_os # pragma: allowlist secret
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      MLX_API_URL: http://host.docker.internal:11435
      WATCHDOG_INTERVAL_SEC: "1800"
      WATCHDOG_SLOW_THRESHOLD_MS: "500"
      WATCHDOG_AUTONOMOUS: "true"
    volumes:
      - ../knowledge_os:/app/knowledge_os
      - /var/run/docker.sock:/var/run/docker.sock
    working_dir: /app/knowledge_os/app
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: ["python", "-u", "performance_watchdog.py"]
    depends_on:
      db:
        condition: service_healthy

  # Perpetual Evolution Engine: автономный цикл эволюции (каждые 2 ч)
  knowledge_evolution:
    build:
      context: ..
      dockerfile: infrastructure/docker/agents/Dockerfile
    container_name: knowledge_evolution
    restart: unless-stopped
    mem_limit: 4g
    networks:
      - atra-network
    environment:
      TZ: Europe/Moscow
      PYTHONPATH: /app/knowledge_os:/app/knowledge_os:/app
      DATABASE_URL: postgresql://admin:secret@knowledge_pgbouncer:6432/knowledge_os # pragma: allowlist secret
      POSTGRES_DIRECT_URL: postgresql://admin:secret@knowledge_postgres:5432/knowledge_os # pragma: allowlist secret
      REDIS_URL: redis://knowledge_os_redis:6379/0
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      MLX_API_URL: http://host.docker.internal:11435
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-300}
      EVOLUTION_INTERVAL_SEC: "3600"
    volumes:
      - ../knowledge_os:/app/knowledge_os
      - /var/run/docker.sock:/var/run/docker.sock
    working_dir: /app/knowledge_os/app
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: ["python", "-u", "run_evolution_loop.py"]
    depends_on:
      db:
        condition: service_healthy

  # Omni-RAG v3: Мультимодальный визуальный поиск (VRAG/VimRAG)
  victoria-visual-search:
    build:
      context: ./app/visual_search
      dockerfile: Dockerfile
    container_name: victoria-visual-search
    restart: unless-stopped
    mem_limit: 4g
    networks:
      - atra-network
    environment:
      TZ: Europe/Moscow
      PYTHONPATH: /app
      EMBEDDING_MODEL: "nomic-embed-text"
      OLLAMA_BASE_URL: "http://host.docker.internal:11434"
      DEVICE: "cpu"
    ports:
      - "8005:8005"
    volumes:
      - ../knowledge_os/models:/app/models
      - ../docs:/app/corpus/docs:ro
      - ../knowledge_os/app:/app/corpus/knowledge_os:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  open-webui-data:
  # Используем atra_knowledge_postgres_data (86 экспертов, 26k узлов) — данные atra/atra-web-ide
  # Если нужна пустая БД: заменить на postgres_data: {} и пересоздать контейнер
  postgres_data:
    external: true
    name: atra_knowledge_postgres_data
  redis_data:
  prometheus_data:
  grafana_data:
  elasticsearch_data:

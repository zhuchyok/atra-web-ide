# Core Infrastructure for Singularity 31.2
# Usage: docker-compose -f knowledge_os/docker-compose.yml up -d
# To run all services:
# docker-compose -f knowledge_os/docker-compose.yml up -d

include:
  - path: docker-compose.agents.yml
  - path: docker-compose.ui.yml
  - path: docker-compose.monitoring.yml

networks:
  atra-network:
    external: true

volumes:
  open-webui-data:
  postgres_data:
    external: true
    name: atra_knowledge_postgres_data
  redis_data:
  prometheus_data:
  grafana_data:
  elasticsearch_data:

x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    logging: *default-logging
    mem_limit: 8g
    cpus: 2
    image: pgvector/pgvector:pg16
    container_name: knowledge_postgres
    restart: always
    shm_size: 512mb
    command:
      [
        "postgres",
        "-c",
        "shared_preload_libraries=pg_stat_statements",
        "-c",
        "max_connections=500",
        "-c",
        "shared_buffers=4GB",
        "-c",
        "work_mem=64MB",
        "-c",
        "maintenance_work_mem=512MB",
        "-c",
        "effective_cache_size=12GB",
      ]
    environment:
      TZ: Europe/Moscow
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/01-schema.sql
    networks:
      - atra-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d knowledge_os"]
      interval: 5s
      timeout: 5s
      retries: 5

  pgbouncer:
    image: edoburu/pgbouncer:latest
    container_name: knowledge_pgbouncer
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      TZ: Europe/Moscow
    volumes:
      - ./pgbouncer/pgbouncer.ini:/etc/pgbouncer/pgbouncer.ini:ro
      - ./pgbouncer/userlist.txt:/etc/pgbouncer/userlist.txt:ro
    ports:
      - "6432:6432"
    networks:
      - atra-network
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -h localhost -p 6432 -U admin -d knowledge_os",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: knowledge_os_redis
    restart: always
    command:
      [
        "redis-server",
        "--maxmemory",
        "2gb",
        "--maxmemory-policy",
        "allkeys-lru",
        "--unixsocket",
        "/data/redis.sock",
        "--unixsocketperm",
        "777",
      ]
    environment:
      TZ: Europe/Moscow
    ports:
      - "6381:6379"
    volumes:
      - redis_data:/data
    networks:
      - atra-network
    healthcheck:
      test: ["CMD", "redis-cli", "-s", "/data/redis.sock", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  searxng:
    image: searxng/searxng:latest
    container_name: searxng
    restart: unless-stopped
    ports:
      - "8084:8080"
    volumes:
      - ./configs/searxng:/etc/searxng:rw
    environment:
      - INSTANCE_NAME=ATRA SearXNG
      - BASE_URL=http://localhost:8084/
    networks:
      - atra-network

# Knowledge OS + Victoria + Veronica на Mac Studio
# Запуск: docker-compose -f knowledge_os/docker-compose.yml up -d
# Контекст: корень репо (atra или atra-web-ide)
# Сеть atra-network: скрипт start_victoria_docker.sh создаёт её при первом запуске (docker network create atra-network)
# Учёт загрузки Mac Studio: docs/MAC_STUDIO_LOAD_AND_VICTORIA.md (память Docker, USE_ELK, async_mode, лимиты)

networks:
  atra-network:
    external: true

services:
  # PostgreSQL: самовосстановление после перезагрузки Mac Studio (restart: always)
  db:
    image: pgvector/pgvector:pg16
    container_name: knowledge_postgres
    restart: always
    mem_limit: 4g
    shm_size: 512mb
    command:
      [
        "postgres",
        "-c",
        "shared_preload_libraries=pg_stat_statements",
        "-c",
        "max_connections=500",
        "-c",
        "shared_memory_type=sysv",
        "-c",
        "idle_in_transaction_session_timeout=300000",
        "-c",
        "idle_session_timeout=600000",
        "-c",
        "tcp_keepalives_idle=60",
        "-c",
        "tcp_keepalives_interval=10",
        "-c",
        "tcp_keepalives_interval=10",
        "-c",
        "tcp_keepalives_count=3",
      ]
    # max_connections=200: Victoria Enhanced создаёт 20+ пулов × min_size=1 → ~60 прямых соединений
    # PgBouncer добавляет ≤25; итого буфер до 200 (было 100 — overflow при нагрузке)
    # idle_session_timeout=600s: закрывает idle соединения через 10 мин
    # idle_in_transaction_session_timeout=300s: убивает idle-in-transaction через 5 мин
    environment:
      TZ: Europe/Moscow
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # При первом запуске (пустой volume) Postgres выполняет скрипты из docker-entrypoint-initdb.d — каноническая схема (knowledge_nodes.id UUID), затем apply_migrations достраивает таблицы
      - ./db/init.sql:/docker-entrypoint-initdb.d/01-schema.sql
    networks:
      - atra-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d knowledge_os"]
      interval: 5s
      timeout: 5s
      retries: 5

  # PgBouncer: connection pooler перед PostgreSQL.
  # Все сервисы коннектятся на pgbouncer:6432, тот держит ≤20 реальных соединений к postgres:5432.
  # Исключение: employees_sync_daemon использует POSTGRES_DIRECT_URL → postgres:5432 (LISTEN/NOTIFY).
  pgbouncer:
    image: edoburu/pgbouncer:latest
    container_name: knowledge_pgbouncer
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      TZ: Europe/Moscow
    volumes:
      - ./pgbouncer/pgbouncer.ini:/etc/pgbouncer/pgbouncer.ini:ro
      - ./pgbouncer/userlist.txt:/etc/pgbouncer/userlist.txt:ro
    ports:
      - "6432:6432"
    networks:
      - atra-network
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -h localhost -p 6432 -U admin -d knowledge_os",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  # Redis: кэш и очереди (restart: always). Имя knowledge_os_redis — чтобы не конфликтовать с atra (отдельный проект)
  redis:
    image: redis:7-alpine
    container_name: knowledge_os_redis
    restart: always
    environment:
      TZ: Europe/Moscow
    ports:
      - "6381:6379" # 6381 на хосте (6380 может быть занят atra в отдельном проекте)
    volumes:
      - redis_data:/data
    networks:
      - atra-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  quality-service:
    build:
      context: app
      dockerfile: Dockerfile.quality
    container_name: quality-service
    restart: unless-stopped
    ports:
      - "8003:8003"
    networks:
      - default
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8003/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  # Simple Worker: processes code tasks via Redis queue
  simple-worker:
    build:
      context: ..
      dockerfile: infrastructure/docker/agents/Dockerfile
    container_name: simple-worker
    restart: unless-stopped
    volumes:
      - ..:/app
    environment:
      - PYTHONPATH=/app:/app/knowledge_os/app
      - REDIS_URL=redis://knowledge_os_redis:6379/0
    command: python3 knowledge_os/app/simple_worker.py
    networks:
      - atra-network
    depends_on:
      - redis

  victoria-agent:
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    build:
      context: ..
      dockerfile: infrastructure/docker/agents/Dockerfile
    container_name: victoria-agent
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 8g
    oom_kill_disable: false
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 60s
      timeout: 30s
      retries: 5
      start_period: 120s
    user: root
    networks:
      - atra-network
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      TZ: Europe/Moscow
      CORPORATION_TZ: Europe/Moscow
      PYTHONPATH: /app
      VICTORIA_PORT: "8000" # внутри контейнера 8000, снаружи 8010
      ATRA_ENV: prod
      DATABASE_URL: postgresql://admin:secret@knowledge_pgbouncer:6432/knowledge_os # pragma: allowlist secret
      POSTGRES_DIRECT_URL: postgresql://admin:secret@knowledge_postgres:5432/knowledge_os # pragma: allowlist secret
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      OLLAMA_API_URL: http://host.docker.internal:11434
      SERVER_LLM_URL: http://host.docker.internal:11434
      # [SINGULARITY 26.5] Оптимизация Ollama для Mac Studio
      # OLLAMA_NUM_PARALLEL: 2 — позволяет выполнять 2 запроса одновременно
      # OLLAMA_MAX_VRAM: 48GB — запас для 35B моделей на 64GB Mac Studio
      OLLAMA_NUM_PARALLEL: "2"
      OLLAMA_MAX_VRAM: "48000000000"
      # [SINGULARITY 26.6] Синхронизация слотов с параллелизмом Ollama
      # OLLAMA_GLOBAL_MAX_SLOTS: 2 — предотвращает переполнение очереди Ollama (NUM_PARALLEL=2)
      OLLAMA_GLOBAL_MAX_SLOTS: "2"
      # MLX API Server: используем нашу новую обученную модель
      MLX_API_URL: ${MLX_API_URL:-http://host.docker.internal:11435}
      MLX_HEALTH_URL: http://host.docker.internal:11435/health
      # [SINGULARITY 21.5] ResourceGuard: повышен порог CPU до 90% — 75% слишком агрессивно,
      # блокирует пользовательский чат когда оркестратор занят фоновой работой
      GUARD_CPU_THRESHOLD: "90.0"
      GUARD_RAM_THRESHOLD: "92.0"
      # [SINGULARITY 21.5] SearXNG self-hosted веб-поиск (http://searxng:8080 внутри Docker)
      SEARXNG_URL: "http://searxng:8080"
      WEB_SEARCH_PROVIDERS: "searxng,duckduckgo,ollama"
      VICTORIA_MODEL: "victoria-wisdom-v3.5:latest"
      VICTORIA_PLANNER_MODEL: "victoria-wisdom-v3.5"
      # Мозг (MLX, порт 11435): planner → MLX (victoria-wisdom-v3.5 без тега)
      # Руки (Ollama, порт 11434): executor → victoria-wisdom-v3.5:latest
      USE_MLX_FOR_PLANNER: "true"
      # Strategy: tinyllama (уже загружена, бессмертна, ответ <2с, не блокирует 35B очередь)
      # phi3.5:3.8b не подходит: при рестарте Victoria холодная загрузка блокируется занятым Ollama
      VICTORIA_STRATEGY_MODEL: "tinyllama:1.1b-chat"
      VICTORIA_STRATEGY_BASE_URL: "http://host.docker.internal:11434"
      # [SINGULARITY 21.5] Disable model selector for God Mode consistency
      VICTORIA_USE_MODEL_SELECTOR: "false"
      # [SINGULARITY 21.6] Force Wisdom 3.5 for all steps
      VICTORIA_FORCE_STEP_MODEL: "victoria-wisdom-v3.5:latest"
      # 🐛 Debug mode: set to "true" to enable verbose logging
      VICTORIA_DEBUG: ${VICTORIA_DEBUG:-"false"}
      # Таймаут одного вызова LLM (Ollama): 300 с — чтобы не обрывать ответ на тяжёлых моделях
      OLLAMA_EXECUTOR_TIMEOUT: ${OLLAMA_EXECUTOR_TIMEOUT:-300}
      # Руки Виктории: держать victoria-wisdom-v3.5 в Ollama (300 = 5 мин; -1 = бессрочно в Ollama API)
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-300}
      # Uvicorn: keep-alive для долгих sync-запросов (стратегия + LLM), иначе соединение может обрываться
      # Увеличено до 1800 (30 минут) для сложных задач типа SEO-анализа
      UVICORN_TIMEOUT_KEEP_ALIVE: ${UVICORN_TIMEOUT_KEEP_ALIVE:-1800}
      # Таймаут понимания цели — 90 сек для нормальных задач (LLM вызов = 60 сек)
      UNDERSTAND_GOAL_TIMEOUT_SEC: ${UNDERSTAND_GOAL_TIMEOUT_SEC:-90}
      # Таймаут LLM вызова внутри understand_goal
      UNDERSTAND_GOAL_LLM_TIMEOUT_SEC: ${UNDERSTAND_GOAL_LLM_TIMEOUT_SEC:-60}
      # Таймаут выбора стратегии (phi3.5 — быстро, 30 сек достаточно)
      STRATEGY_CALL_TIMEOUT_SEC: ${STRATEGY_CALL_TIMEOUT_SEC:-30}
      # IP Rate Limiting: заблокированные IP (через запятую) и лимиты POST запросов
      VICTORIA_BLOCKED_IPS: ${VICTORIA_BLOCKED_IPS:-}
      IP_RATE_WINDOW_SEC: ${IP_RATE_WINDOW_SEC:-60}
      IP_RATE_MAX_POST: ${IP_RATE_MAX_POST:-10}
      # Heartbeat для SSE streaming (15 сек → 10 сек для предотвращения обрывов)
      VICTORIA_STREAM_HEARTBEAT_SEC: ${VICTORIA_STREAM_HEARTBEAT_SEC:-10}
      # Прогрев при старте: греем VICTORIA_PLANNER_MODEL + VICTORIA_MODEL (+ VICTORIA_WARMUP_EXTRA_MODELS через запятую)
      # VICTORIA_WARMUP_BLOCK_STARTUP=true = ждать прогрева до приёма запросов (стабильный первый sync)
      # VICTORIA_WARMUP_BLOCK_STARTUP: ${VICTORIA_WARMUP_BLOCK_STARTUP:-false}
      # VICTORIA_WARMUP_EXTRA_MODELS: ${VICTORIA_WARMUP_EXTRA_MODELS:-qwen2.5-coder:32b,nomic-embed-text}
      # VICTORIA_WARMUP_TIMEOUT_PER_MODEL: ${VICTORIA_WARMUP_TIMEOUT_PER_MODEL:-90}
      VICTORIA_WARMUP_BLOCK_STARTUP: "false"
      VICTORIA_WARMUP_EXTRA_MODELS: ""
      VICTORIA_USE_LOCAL_ROUTER: "true"
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_FALLBACK_MODEL: ${OPENROUTER_FALLBACK_MODEL:-mistralai/mistral-7b-instruct:free}
      OPENROUTER_CODING_MODEL: ${OPENROUTER_CODING_MODEL:-qwen/qwen-2.5-coder-32b-instruct:free}
      OPENROUTER_HTTP_REFERER: ${OPENROUTER_HTTP_REFERER:-https://github.com/atra-web-ide}
      OPENROUTER_APP_TITLE: ${OPENROUTER_APP_TITLE:-ATRA Web IDE}
      USE_ELK: "false"
      # DB connection pool limits (best practice: маленький пул на сервис, мультиплексирование через PgBouncer)
      DB_POOL_MAX_SIZE: ${DB_POOL_MAX_SIZE:-5}
      DB_POOL_MIN_SIZE: ${DB_POOL_MIN_SIZE:-1}
      ELASTICSEARCH_URL: http://atra-elasticsearch:9200
      USE_KNOWLEDGE_OS: "true"
      VICTORIA_USE_CACHE: "false"
      # Redis: для RAG_CACHE_BACKEND=redis (масштабирование). По умолчанию кэш memory.
      REDIS_URL: redis://knowledge_os_redis:6379/0
      RAG_CACHE_BACKEND: redis
      # 🚀 Victoria Enhanced - включает все компоненты супер-корпорации
      USE_VICTORIA_ENHANCED: "true"
      # Эксперты первыми: execution-задачи идут в Victoria Enhanced (86 экспертов в БД), в Veronica — только простые шаги (docs/VERONICA_REAL_ROLE.md)
      PREFER_EXPERTS_FIRST: ${PREFER_EXPERTS_FIRST:-true}

      # 🔒 Строго локальный режим (STRICT_LOCAL): без fallback на cursor-agent/облачные API
      # При true: все запросы обслуживаются только MLX/Ollama; при недоступности локальных моделей — явная ошибка
      # Pre-flight checklist (обязательно перед включением): docs/MASTER_REFERENCE.md, раздел STRICT_LOCAL
      STRICT_LOCAL: ${STRICT_LOCAL:-false}
      # План → исполнение: при плане от оркестратора вызывать экспертов по assignments и подставлять результаты в контекст (план «как я» п.12.2 п.1)
      EXECUTE_ASSIGNMENTS_IN_RUN: ${EXECUTE_ASSIGNMENTS_IN_RUN:-true}
      # 🎯 Victoria Initiative - Event-Driven Architecture и мониторинг (без кавычек в значении)
      # По умолчанию false — меньше памяти при старте, меньше OOM (VICTORIA_RESTARTS_CAUSE §2). Включить в .env при 10–14 GB Docker Memory.
      ENABLE_EVENT_MONITORING: ${ENABLE_EVENT_MONITORING:-true}
      HOST_SANDBOX_SHARED_DIR: ${HOST_SANDBOX_SHARED_DIR:-/Users/bikos/Documents/atra-web-ide/knowledge_os/sandbox_shared}
      FILE_WATCHER_ENABLED: ${FILE_WATCHER_ENABLED:-true}
      SERVICE_MONITOR_ENABLED: ${SERVICE_MONITOR_ENABLED:-true}
      RAG_PRELOAD_TYPICAL_QUERIES: ${RAG_PRELOAD_TYPICAL_QUERIES:-true}
      # Опционально: лёгкая MLX-классификация для запросов с category=general и 5–25 слов (docs/MLX_STRATEGY_LIGHT_AND_VITALITY.md)
      # Мозг Виктории: при VICTORIA_MLX_BRAIN=true все victoria-wisdom-v3.5 запросы идут в MLX (быстрее, не блокирует Ollama очередь)
      VICTORIA_MLX_BRAIN: ${VICTORIA_MLX_BRAIN:-true}
      VICTORIA_MLX_LIGHT_CLASSIFY: ${VICTORIA_MLX_LIGHT_CLASSIFY:-false}
      DEADLINE_TRACKER_ENABLED: ${DEADLINE_TRACKER_ENABLED:-true}
      SKILLS_WATCHER_ENABLED: ${SKILLS_WATCHER_ENABLED:-true}
      # 📊 OpenTelemetry для трассировки
      ENABLE_OTEL: ${ENABLE_OTEL:-"true"}
      OTLP_ENDPOINT: ${OTLP_ENDPOINT:-"http://atra-prometheus:9090"}
      OTLP_INSECURE: ${OTLP_INSECURE:-"true"}
      # 👤 Human-in-the-Loop
      USE_HITL: ${USE_HITL:-"false"}
      HITL_CONFIDENCE_THRESHOLD: ${HITL_CONFIDENCE_THRESHOLD:-"0.7"}
      # 🏢 Основной проект корпорации
      MAIN_PROJECT: "atra-web-ide" # Основной проект корпорации и агентов
      WORKSPACE_ROOT: /app # Корень для SafeFileWriter (create_file/write_file)
      AGENT_BACKUP_ENABLED: "true" # Бэкапы перед перезаписью
      AGENT_APPROVAL_REQUIRED: "false" # true = отказ в записи в package.json, .env, Dockerfile и т.п.
      # Лимит шагов агента (сложные задачи — анализ, исправления; без этой переменной в контейнере мог остаться 80)
      VICTORIA_MAX_STEPS: ${VICTORIA_MAX_STEPS:-500}
      # Логика мысли: выбор стратегии ответа (quick_answer / deep_analysis / need_clarification / decline_or_redirect), docs/PLAN_REASONING_LOGIC_VICTORIA.md
      VICTORIA_STRATEGY_ENABLED: ${VICTORIA_STRATEGY_ENABLED:-true}
      STRATEGY_CACHE_TTL_SEC: ${STRATEGY_CACHE_TTL_SEC:-120}
      # Долгосрочная память по пользователю/проекту (Фаза 2)
      LONG_TERM_MEMORY_ENABLED: ${LONG_TERM_MEMORY_ENABLED:-true}
      LONG_TERM_MEMORY_TTL_DAYS: ${LONG_TERM_MEMORY_TTL_DAYS:-7}
      LONG_TERM_MEMORY_MAX_THREADS: ${LONG_TERM_MEMORY_MAX_THREADS:-20}
      # Рефлексия и пересмотр плана (Фаза 3, ReCAP): чекпоинты при провале шага, лимит пересмотров
      VICTORIA_REFLECTION_ENABLED: ${VICTORIA_REFLECTION_ENABLED:-true}
      VICTORIA_MAX_PLAN_REVISIONS: ${VICTORIA_MAX_PLAN_REVISIONS:-1}
      # Telegram Bot для отчетов и алертов
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-8461566302:AAFdSGcVzyEQG1UMu2s954DMJk-wzN7R3Hs}
      TG_TOKEN: ${TG_TOKEN:-8461566302:AAFdSGcVzyEQG1UMu2s954DMJk-wzN7R3Hs}
      CHAT_ID: ${TELEGRAM_USER_ID:-556251171}
      EARLY_WARNING_TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-8461566302:AAFdSGcVzyEQG1UMu2s954DMJk-wzN7R3Hs}
      EARLY_WARNING_TELEGRAM_CHAT_ID: ${TELEGRAM_USER_ID:-556251171}
      TELEGRAM_USER_ID: ${TELEGRAM_USER_ID:-556251171}
      # Veronica: из контейнера — по имени сервиса (порт 8000 внутри сети)
      VERONICA_URL: ${VERONICA_URL:-http://veronica-agent:8000}
      # Canary: оркестрация V2 (A/B по проценту трафика)
      ORCHESTRATION_V2_ENABLED: ${ORCHESTRATION_V2_ENABLED:-true}
      ORCHESTRATION_V2_PERCENTAGE: ${ORCHESTRATION_V2_PERCENTAGE:-50}
      # Stability & Performance Watchdog: Backpressure
      SMART_WORKER_MAX_PENDING: ${SMART_WORKER_MAX_PENDING:-10}
      # Circuit Breaker: таймаут задачи (3600s = 60 мин для сложных LLM-задач)
      WORKER_TASK_TOTAL_TIMEOUT: ${WORKER_TASK_TOTAL_TIMEOUT:-3600}
    ports:
      - "8010:8000" # ✅ ОБЩИЙ порт для всех проектов (atra, atra-web-ide, новые проекты)
    volumes:
      - ../data:/app/data
      - ../logs:/app/logs
      - ../src:/app/src
      - ../knowledge_os:/app/knowledge_os
      # Доступ к данным для анализа (Singularity 21.24)
      - /Users/bikos/Downloads:/data/downloads:ro
      # Мульти-проектный доступ: весь dev/ — новые проекты подхватываются автоматически
      - ../../dev:/workspace/dev
      - ..:/workspace/atra-web-ide
      - /var/run/docker.sock:/var/run/docker.sock
      # Глобальные правила и Библия: доступны через /workspace/atra-web-ide/.cursorrules
      # и /workspace/atra-web-ide/docs/MASTER_REFERENCE.md (файловые маунты убраны —
      # Docker Desktop на macOS путает file-bind-mount с директорией после рестарта)
      - ../.cursor/rules:/workspace/global/.cursor/rules:ro
    command: >
      sh -c "python -c 'import sys; sys.setrecursionlimit(1000)' & 
      python /app/knowledge_os/app/victoria_worker.py & 
      python -m src.agents.bridge.victoria_server"

  # SearXNG: self-hosted поисковик для автономного веб-поиска (порт 8084)
  # [SINGULARITY 21.5] Автономность: Victoria использует SearXNG вместо внешних API
  searxng:
    image: searxng/searxng:latest
    container_name: searxng
    restart: unless-stopped
    ports:
      - "8084:8080"
    volumes:
      - ./configs/searxng:/etc/searxng:rw
    environment:
      - INSTANCE_NAME=ATRA SearXNG
      - BASE_URL=http://localhost:8084/
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    networks:
      - atra-network

  # Воркер для тяжелых задач (Heavy Worker) - 1 инстанс
  # Open WebUI: профессиональный интерфейс для Виктории и облачных моделей
  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: open-webui
    restart: always
    mem_limit: 2g
    ports:
      - "3005:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - TZ=Europe/Moscow
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      - OPENAI_API_BASE_URL=http://victoria-agent:8000/v1
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - WEBUI_SECRET_KEY=${WEBUI_SECRET_KEY:-}
      - ENABLE_SIGNUP=false
      - DEFAULT_MODELS=Victoria
      - ENV=dev
      - WEBUI_ADMIN_EMAIL=${OPENWEBUI_ADMIN_EMAIL:-admin@atra.local}
      - WEBUI_ADMIN_PASSWORD=${OPENWEBUI_ADMIN_PASSWORD:-atra-admin-2026}
      - AIOHTTP_CLIENT_TIMEOUT=1200
      - AIOHTTP_CLIENT_TIMEOUT_TOOL_SERVER_DATA=1200
      # Таймаут запроса списка моделей (сек); короткий — быстрый отказ, не блокирует UI
      - AIOHTTP_CLIENT_TIMEOUT_MODEL_LIST=30
      - OLLAMA_API_BASE_URL=http://host.docker.internal:11434/api
      - OPENWEBUI_NAME=ATRA Singularity 14.0
      # [SINGULARITY 21.5] SearXNG self-hosted: автономный веб-поиск без внешних API
      - ENABLE_RAG_WEB_SEARCH=True
      - RAG_WEB_SEARCH_ENGINE=searxng
      - SEARXNG_QUERY_URL=http://searxng:8080/search?q=<query>&format=json
    volumes:
      - open-webui-data:/app/backend/data
      - /Users/bikos/Documents/atra-web-ide/docs:/workspace/global_docs:ro
      - ../configs:/workspace/configs:ro
    networks:
      - atra-network

  expert-worker-heavy:
    depends_on:
      victoria-agent:
        condition: service_started
      redis:
        condition: service_healthy
    build:
      context: ..
      dockerfile: infrastructure/docker/agents/Dockerfile
    container_name: expert-worker-heavy
    restart: always
    deploy:
      resources:
        limits:
          memory: 6g
        reservations:
          memory: 512m
    networks:
      - atra-network
    environment:
      TZ: Europe/Moscow
      PYTHONPATH: /app:/app/knowledge_os/app
      DATABASE_URL: postgresql://admin:secret@knowledge_pgbouncer:6432/knowledge_os # pragma: allowlist secret
      POSTGRES_DIRECT_URL: postgresql://admin:secret@knowledge_postgres:5432/knowledge_os # pragma: allowlist secret
      REDIS_URL: redis://knowledge_os_redis:6379/0
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-300}
      MLX_API_URL: http://host.docker.internal:11435
      VICTORIA_MLX_BRAIN: ${VICTORIA_MLX_BRAIN:-true}
      # Тяжелая модель для кода и архитектуры
      VICTORIA_MODEL: ${VICTORIA_HEAVY_MODEL:-victoria-wisdom-v3.5}
      ENABLE_COLLECTIVE_LEARNING: "true"
      LEARNING_SYNC_INTERVAL: "300"
      SMART_WORKER_MAX_CONCURRENT: "1"
      WORKER_TYPE: "heavy"
      SMART_WORKER_LLM_TIMEOUT: "1800"
      SMART_WORKER_LLM_STUCK_MINUTES: "30"
      WORKER_TASK_TOTAL_TIMEOUT: "7200"
      DB_POOL_MAX_SIZE: ${DB_POOL_MAX_SIZE:-5}
      DB_POOL_MIN_SIZE: ${DB_POOL_MIN_SIZE:-1}
    volumes:
      - ../data:/app/data
      - ../logs:/app/logs
      - ../src:/app/src
      - ../knowledge_os:/app/knowledge_os
      - /Users/bikos/Downloads:/data/downloads:ro
      - /var/run/docker.sock:/var/run/docker.sock
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: python3 knowledge_os/app/expert_worker.py

  # Воркеры для легких задач (Light Workers) - 2 инстанса
  expert-worker-light:
    depends_on:
      victoria-agent:
        condition: service_started
      redis:
        condition: service_healthy
    build:
      context: ..
      dockerfile: infrastructure/docker/agents/Dockerfile
    restart: always
    deploy:
      replicas: 2
      resources:
        limits:
          memory: 2g
        reservations:
          memory: 256m
    networks:
      - atra-network
    environment:
      TZ: Europe/Moscow
      PYTHONPATH: /app:/app/knowledge_os/app
      DATABASE_URL: postgresql://admin:secret@knowledge_pgbouncer:6432/knowledge_os # pragma: allowlist secret
      POSTGRES_DIRECT_URL: postgresql://admin:secret@knowledge_postgres:5432/knowledge_os # pragma: allowlist secret
      REDIS_URL: redis://knowledge_os_redis:6379/0
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-300}
      MLX_API_URL: http://host.docker.internal:11435
      VICTORIA_MLX_BRAIN: ${VICTORIA_MLX_BRAIN:-true}
      # Легкая модель для классификации и простых ответов
      VICTORIA_MODEL: ${VICTORIA_LIGHT_MODEL:-lfm2.5-thinking:1.2b}
      ENABLE_COLLECTIVE_LEARNING: "true"
      LEARNING_SYNC_INTERVAL: "300"
      SMART_WORKER_MAX_CONCURRENT: "2"
      WORKER_TYPE: "light"
      SMART_WORKER_LLM_TIMEOUT: "1800"
      SMART_WORKER_LLM_STUCK_MINUTES: "30"
      WORKER_TASK_TOTAL_TIMEOUT: "7200"
    volumes:
      - ../data:/app/data
      - ../logs:/app/logs
      - ../src:/app/src
      - ../knowledge_os:/app/knowledge_os
      - /var/run/docker.sock:/var/run/docker.sock
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: python3 knowledge_os/app/expert_worker.py

  veronica-agent:
    depends_on:
      db:
        condition: service_healthy
    build:
      context: ..
      dockerfile: infrastructure/docker/agents/Dockerfile
    container_name: veronica-agent
    restart: always
    networks:
      - atra-network
    environment:
      TZ: Europe/Moscow
      PYTHONPATH: /app
      ATRA_ENV: prod
      DATABASE_URL: postgresql://admin:secret@knowledge_pgbouncer:6432/knowledge_os # pragma: allowlist secret
      POSTGRES_DIRECT_URL: postgresql://admin:secret@knowledge_postgres:5432/knowledge_os # pragma: allowlist secret
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      USE_ELK: "true"
      ELASTICSEARCH_URL: http://atra-elasticsearch:9200
      # 🚀 Veronica Enhanced - включает все компоненты супер-корпорации
      USE_VERONICA_ENHANCED: "true"
      # 📊 OpenTelemetry для трассировки
      ENABLE_OTEL: ${ENABLE_OTEL:-"false"}
      OTLP_ENDPOINT: ${OTLP_ENDPOINT:-""}
      OTLP_INSECURE: ${OTLP_INSECURE:-"true"}
      # 👤 Human-in-the-Loop
      USE_HITL: ${USE_HITL:-"false"}
      HITL_CONFIDENCE_THRESHOLD: ${HITL_CONFIDENCE_THRESHOLD:-"0.7"}
      # 🏢 Основной проект корпорации
      MAIN_PROJECT: "atra-web-ide" # Основной проект корпорации и агентов
      # 🔄 АВТОВЫБОР МОДЕЛЕЙ для Veronica (как для Victoria)
      # Пустые значения = автоматический выбор лучшей доступной модели из Ollama
      # Для явного указания: VERONICA_MODEL=qwen2.5-coder:32b
      VERONICA_MODEL: ${VERONICA_MODEL:-}
      VERONICA_PLANNER_MODEL: ${VERONICA_PLANNER_MODEL:-}
      # [SINGULARITY 14.0] Browser-Use / Playwright
      PLAYWRIGHT_BROWSERS_PATH: /app/pw-browsers
      BROWSER_USE_HEADLESS: ${BROWSER_USE_HEADLESS:-true}
      # Victoria Operator: Veronica acts as eyes and hands
      VICTORIA_OPERATOR_ENABLED: "true"
      DB_POOL_MAX_SIZE: ${DB_POOL_MAX_SIZE:-5}
      DB_POOL_MIN_SIZE: ${DB_POOL_MIN_SIZE:-1}
    ports:
      - "8011:8000" # ✅ ОБЩИЙ порт для всех проектов (atra, atra-web-ide, новые проекты)
    volumes:
      - ../data:/app/data
      - ../logs:/app/logs
      - ../src:/app/src
      - ../knowledge_os:/app/knowledge_os
      # Мульти-проектный доступ: весь dev/ — новые проекты подхватываются автоматически
      - ../../dev:/workspace/dev
      - ..:/workspace/atra-web-ide
      # Глобальные правила и Библия: доступны через /workspace/atra-web-ide/
      - ../.cursor/rules:/workspace/global/.cursor/rules:ro
    command: python -m src.agents.bridge.server

  prometheus:
    image: prom/prometheus:latest
    container_name: atra-prometheus
    environment:
      TZ: Europe/Moscow
    ports:
      - "9092:9090" # 9092 на хосте (9090/9091 могут быть заняты другими Prometheus)
    volumes:
      - ../infrastructure/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.console.libraries=/usr/share/prometheus/console_libraries"
      - "--web.console.templates=/usr/share/prometheus/consoles"
      - "--storage.tsdb.retention.time=30d"
    networks:
      - atra-network
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: atra-grafana
    ports:
      - "3001:3000"
    environment:
      - TZ=Europe/Moscow
      - GF_SECURITY_ADMIN_PASSWORD=atra2025
      - GF_INSTALL_PLUGINS=
      - GF_SERVER_ROOT_URL=http://localhost:3001
      - GF_SECURITY_DISABLE_GRAVATAR=true
    volumes:
      - grafana_data:/var/lib/grafana
      - ../infrastructure/monitoring/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      # Один каталог со всеми дашбордами (dashboard.yml, atra-dashboard.json, enhanced-dashboard.json)
      - ../infrastructure/monitoring/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
    networks:
      - atra-network
    depends_on:
      - prometheus
    restart: unless-stopped

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
    container_name: atra-elasticsearch
    restart: unless-stopped
    # mem_limit: 6g — было 4g: OOM kills 04:16 и 05:15 UTC 2026-04-12.
    # Правило ES: JVM heap = 50% от лимита контейнера; остаток — Lucene page cache.
    # При 4g/2g_heap не хватало буфера → OOM. Теперь 6g/2g_heap — стабильно.
    mem_limit: 6g
    environment:
      - TZ=Europe/Moscow
      - discovery.type=single-node
      - "ES_JAVA_OPTS=-Xms2g -Xmx2g"
      - xpack.security.enabled=false
      - xpack.security.enrollment.enabled=false
    ports:
      - "9200:9200"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    networks:
      - atra-network
    healthcheck:
      test:
        ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5

  kibana:
    image: docker.elastic.co/kibana/kibana:8.11.0
    container_name: atra-kibana
    ports:
      - "5601:5601"
    environment:
      - TZ=Europe/Moscow
      - ELASTICSEARCH_HOSTS=http://atra-elasticsearch:9200
      - ELASTICSEARCH_USERNAME=kibana_system
      - ELASTICSEARCH_PASSWORD=
      - xpack.security.enabled=false
      - xpack.encryptedSavedObjects.encryptionKey=minimal32charencryptionkeyhere!!
    volumes:
      - ../infrastructure/monitoring/kibana/kibana.yml:/usr/share/kibana/config/kibana.yml:ro
    networks:
      - atra-network
    depends_on:
      elasticsearch:
        condition: service_healthy
    restart: unless-stopped

  # Воркер (дневной): обрабатывает PENDING задачи (симуляции, разведка, обычные задачи). LLM на хосте.
  # mem_limit увеличен 3g → 6g: потребление 1.4 GB (2026-04-17).
  knowledge_os_worker:
    build:
      context: ..
      dockerfile: infrastructure/docker/agents/Dockerfile
    container_name: knowledge_os_worker
    restart: unless-stopped
    mem_limit: 6g
    networks:
      - atra-network
    environment:
      TZ: Europe/Moscow
      PYTHONPATH: /app/knowledge_os
      DATABASE_URL: postgresql://admin:secret@knowledge_pgbouncer:6432/knowledge_os # pragma: allowlist secret
      POSTGRES_DIRECT_URL: postgresql://admin:secret@knowledge_postgres:5432/knowledge_os # pragma: allowlist secret
      REDIS_URL: redis://knowledge_os_redis:6379/0
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      OLLAMA_API_URL: http://host.docker.internal:11434
      OLLAMA_EMBED_URL: http://host.docker.internal:11434/api/embeddings
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-300}
      MLX_API_URL: http://host.docker.internal:11435
      SERVER_LLM_URL: http://host.docker.internal:11434
      VICTORIA_MLX_BRAIN: ${VICTORIA_MLX_BRAIN:-true}
      # Потолок: макс. задач «в работе»; выровнен с LLM-ёмкостью (MLX: 2 слота + Ollama: 1 = 3 total)
      SMART_WORKER_MAX_CONCURRENT: "1"
      SMART_WORKER_ADAPTIVE_CONCURRENCY: "true"
      # MLX нестабилен при высоком параллелизме (вылеты) — не более N одновременных запросов к MLX
      ADAPTIVE_MLX_SAFE_MAX: "3"
      # [TTL FIX] Увеличено для delegation задач (SRE best practice: 3x ожидаемое время)
      SMART_WORKER_LLM_TIMEOUT: "1800"
      # [TTL FIX] RAG-Loop Guard — сброс если нет LLM вызова > 30 мин (было 10)
      SMART_WORKER_LLM_STUCK_MINUTES: "30"
      # [TTL FIX] Таймаут для delegation задач — 120 мин (было 60)
      WORKER_TASK_TOTAL_TIMEOUT: "7200"
      # Worker уступает Ollama victoria-agent (low priority → пропускает перегруженный Ollama, уходит на MLX)
      OLLAMA_REQUEST_PRIORITY: "low"
      # Больше попыток и задержка перед повтором — меньше накопления в ручной очереди
      SMART_WORKER_MAX_ATTEMPTS: "5"
      SMART_WORKER_RETRY_DELAY_SEC: "180"
      # Батч по batch_group: один вызов LLM на 2–3 задачи (ARCHITECTURE_IMPROVEMENTS §2.5)
      SMART_WORKER_BATCH_GROUP_LLM: "true"
      # Стратег использует лёгкую модель — тяжёлая 35B не нужна для планирования задач воркера.
      # phi3.5:3.8b уже загружена, освобождает 26 GB Ollama VRAM (убирает дубль victoria-wisdom).
      VICTORIA_STRATEGIST_MODEL: "phi3.5:3.8b"
      VICTORIA_EXECUTOR_MODEL: "victoria-wisdom-v3.5"
      # Stability & Performance Watchdog: Backpressure
      SMART_WORKER_MAX_PENDING: ${SMART_WORKER_MAX_PENDING:-10}
    volumes:
      - ../knowledge_os:/app/knowledge_os
      - /var/run/docker.sock:/var/run/docker.sock
    working_dir: /app/knowledge_os/app
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: ["python", "smart_worker_autonomous.py"]

  # Nightly Learner: обучение экспертов, дебаты, гипотезы. Цикл каждые 24ч.
  # Записывает в knowledge_nodes, tasks — обновляет «БД: X ч назад» на дашборде.
  # mem_limit снижен 25g → 8g (2026-03-22): nightly вызывает внешний Ollama (host.docker.internal),
  # сам модели не грузит. Старый OOM был от zombie-процессов (исправлено). Мониторинг:
  # docker inspect knowledge_nightly --format '{{.State.OOMKilled}}'
  # OLLAMA_KEEP_ALIVE: 60 (1 мин) — выгрузка моделей после цикла (docs/MODEL_UNLOADING_AND_MEMORY.md)
  knowledge_nightly:
    build:
      context: ..
      dockerfile: infrastructure/docker/agents/Dockerfile
    container_name: knowledge_nightly
    restart: unless-stopped
    mem_limit: 8g
    deploy:
      resources:
        limits:
          memory: 8g
    healthcheck:
      test: ["CMD", "sh", "-c", "pgrep -f nightly_learner.py > /dev/null || exit 0"]
      interval: 30m
      timeout: 10s
      retries: 2
      start_period: 5m
    networks:
      - atra-network
    environment:
      TZ: Europe/Moscow
      PYTHONPATH: /app/knowledge_os
      DATABASE_URL: postgresql://admin:secret@knowledge_pgbouncer:6432/knowledge_os # pragma: allowlist secret
      POSTGRES_DIRECT_URL: postgresql://admin:secret@knowledge_postgres:5432/knowledge_os # pragma: allowlist secret
      REDIS_URL: redis://knowledge_os_redis:6379/0
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-300}
      MLX_API_URL: http://host.docker.internal:11435
      MAC_LLM_URL: http://host.docker.internal:11434
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-8461566302:AAFdSGcVzyEQG1UMu2s954DMJk-wzN7R3Hs}
      TG_TOKEN: ${TG_TOKEN:-8461566302:AAFdSGcVzyEQG1UMu2s954DMJk-wzN7R3Hs}
      CHAT_ID: ${TELEGRAM_USER_ID:-556251171}
      EARLY_WARNING_TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-8461566302:AAFdSGcVzyEQG1UMu2s954DMJk-wzN7R3Hs}
      EARLY_WARNING_TELEGRAM_CHAT_ID: ${TELEGRAM_USER_ID:-556251171}
      TELEGRAM_USER_ID: ${TELEGRAM_USER_ID:-556251171}
    volumes:
      - ../knowledge_os:/app/knowledge_os
      - /var/run/docker.sock:/var/run/docker.sock
    working_dir: /app/knowledge_os/app
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: [
        "sh",
        "-c",
        "while true; do \
        HOUR=$$(date +%H); \
        if [ $$HOUR -ge 0 ] && [ $$HOUR -lt 6 ]; then \
        echo \"🌙 [NIGHTLY] Время глубокого обучения (00:00 - 06:00). Запуск одного цикла...\"; \
        python -u nightly_learner.py; \
        echo \"✅ Цикл завершён. Ожидание следующей ночи (до 00:00)...\"; \
        sleep 21600; \
        else \
        echo \"☀️ [NIGHTLY] Сейчас $$HOUR:00. Ожидание окна 00:00 - 06:00...\"; \
        sleep 1800; \
        fi; \
        done",
      ]

  # Knowledge OS REST API (порт 8002) — логирование чата в interaction_logs (Singularity 10.0)
  knowledge_rest:
    build:
      context: ..
      dockerfile: infrastructure/docker/agents/Dockerfile
    container_name: knowledge_rest
    restart: unless-stopped
    ports:
      - "8002:8002"
    networks:
      - atra-network
    environment:
      TZ: Europe/Moscow
      PYTHONPATH: /app/knowledge_os
      DATABASE_URL: postgresql://admin:secret@knowledge_pgbouncer:6432/knowledge_os # pragma: allowlist secret
      POSTGRES_DIRECT_URL: postgresql://admin:secret@knowledge_postgres:5432/knowledge_os # pragma: allowlist secret
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      MLX_API_URL: http://host.docker.internal:11435
      MAC_LLM_URL: http://host.docker.internal:11435
      SERVER_LLM_URL: http://host.docker.internal:11434
    volumes:
      - ../knowledge_os:/app/knowledge_os
      - /var/run/docker.sock:/var/run/docker.sock
    working_dir: /app/knowledge_os/app
    command: ["python", "-u", "rest_api.py"]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy

  # Оркестратор: всё время слушает задачи (вариант A — один процесс с --continuous)
  knowledge_os_orchestrator:
    build:
      context: ..
      dockerfile: infrastructure/docker/agents/Dockerfile
    container_name: knowledge_os_orchestrator
    restart: unless-stopped
    mem_limit: 6g
    mem_reservation: 2g
    networks:
      - atra-network
    environment:
      TZ: Europe/Moscow
      PYTHONPATH: /app/knowledge_os
      DATABASE_URL: postgresql://admin:secret@knowledge_pgbouncer:6432/knowledge_os # pragma: allowlist secret
      POSTGRES_DIRECT_URL: postgresql://admin:secret@knowledge_postgres:5432/knowledge_os # pragma: allowlist secret
      REDIS_URL: redis://knowledge_os_redis:6379/0
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-300}
      MLX_API_URL: http://host.docker.internal:11435
      MAC_LLM_URL: http://host.docker.internal:11434
      # Telegram Notifications
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-8461566302:AAFdSGcVzyEQG1UMu2s954DMJk-wzN7R3Hs}
      TG_TOKEN: ${TG_TOKEN:-8461566302:AAFdSGcVzyEQG1UMu2s954DMJk-wzN7R3Hs}
      CHAT_ID: ${TELEGRAM_USER_ID:-556251171}
      EARLY_WARNING_TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-8461566302:AAFdSGcVzyEQG1UMu2s954DMJk-wzN7R3Hs}
      EARLY_WARNING_TELEGRAM_CHAT_ID: ${TELEGRAM_USER_ID:-556251171}
      TELEGRAM_USER_ID: ${TELEGRAM_USER_ID:-556251171}
      # Живой организм: при недоступности Ollama/MLX оркестратор шлёт POST сюда; на хосте запустить scripts/host_recovery_listener.py
      RECOVERY_WEBHOOK_URL: ${RECOVERY_WEBHOOK_URL:-http://host.docker.internal:9099/recover}
      ORCHESTRATOR_HEALTH_MONITOR_INTERVAL: ${ORCHESTRATOR_HEALTH_MONITOR_INTERVAL:-300}
      ENABLE_EVENT_MONITORING: "true"
      # Stability & Performance Watchdog: Backpressure
      SMART_WORKER_MAX_PENDING: ${SMART_WORKER_MAX_PENDING:-10}
      # Phase 1.6: batch_group для задач одного domain (low/medium)
      BATCH_SMALL_TASKS_ENABLED: "true"
      # mTLS — межкластерная безопасность для MultiClusterBridge (Singularity 21.24)
      # BRIDGE_CERT_PATH: /certs/mac-studio.crt
      # BRIDGE_KEY_PATH: /certs/mac-studio.key
      # BRIDGE_CA_PATH: /certs/ca.crt
    volumes:
      - ../knowledge_os:/app/knowledge_os
      - ../certs:/certs:ro
    working_dir: /app/knowledge_os/app
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command:
      [
        "python",
        "enhanced_orchestrator.py",
        "--continuous",
        "--interval",
        "60",
        "--quick-poll",
        "30",
      ]

  # Отправка уведомлений и отчётов в Telegram: таблица notifications → Telegram; ежедневный отчёт 8:00, еженедельный понедельник 9:00
  telegram-notifications:

      DATABASE_URL: postgresql://admin:secret@knowledge_pgbouncer:6432/knowledge_os # pragma: allowlist secret
      POSTGRES_DIRECT_URL: postgresql://admin:secret@knowledge_postgres:5432/knowledge_os # pragma: allowlist secret
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-8461566302:AAFdSGcVzyEQG1UMu2s954DMJk-wzN7R3Hs}
      TG_TOKEN: ${TG_TOKEN:-8461566302:AAFdSGcVzyEQG1UMu2s954DMJk-wzN7R3Hs}
      CHAT_ID: ${TELEGRAM_USER_ID:-556251171}
      TELEGRAM_USER_ID: ${TELEGRAM_USER_ID:-556251171}
      TELEGRAM_NOTIFICATION_INTERVAL_SEC: ${TELEGRAM_NOTIFICATION_INTERVAL_SEC:-60}
      TELEGRAM_REPORTS_ENABLED: ${TELEGRAM_REPORTS_ENABLED:-true}
    volumes:
      - ../knowledge_os:/app/knowledge_os
      - /var/run/docker.sock:/var/run/docker.sock:ro
    working_dir: /app/knowledge_os/app
    command: ["python", "-u", "telegram_notifications_worker.py"]
    depends_on:

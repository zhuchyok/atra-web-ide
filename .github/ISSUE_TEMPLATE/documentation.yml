name: 📚 Documentation Issue
description: Report missing or incorrect documentation
title: "[Docs]: "
labels: ["docs"]
body:
  - type: markdown
    attributes:
      value: |
        Спасибо за помощь в улучшении документации!
  
  - type: textarea
    id: issue
    attributes:
      label: Проблема с документацией
      description: Что не так с текущей документацией?
      placeholder: "В разделе X написано Y, но должно быть Z..."
    validations:
      required: true
  
  - type: input
    id: location
    attributes:
      label: Где находится документ?
      description: Путь к файлу или URL
      placeholder: "docs/PROJECT_ARCHITECTURE_AND_GUIDE.md"
    validations:
      required: true
  
  - type: dropdown
    id: type
    attributes:
      label: Тип проблемы
      options:
        - Неточная информация
        - Устаревшая информация
        - Отсутствует информация
        - Опечатка
        - Плохое форматирование
        - Другое
    validations:
      required: true
  
  - type: textarea
    id: suggestion
    attributes:
      label: Предлагаемое исправление
      description: Как это должно выглядеть?
  
  - type: textarea
    id: additional
    attributes:
      label: Дополнительная информация
      description: Контекст, примеры

# E2E Playwright Tests
# Based on Element Plus best practices
# Runs on push/PR with artifacts upload and parallel execution

name: E2E Playwright

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  e2e:
    name: E2E Tests (Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    steps:
      - uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: cd frontend && npm ci

      - name: Build frontend
        run: cd frontend && npm run build

      - name: Create Docker network
        run: docker network create atra-network 2>/dev/null || true

      - name: Create .env file
        run: |
          cat > .env << EOF
          NODE_ENV=test
          BASE_URL=http://localhost:3000
          BACKEND_URL=http://localhost:8080
          EOF

      - name: Start services (docker compose)
        run: docker compose up -d

      - name: Wait for backend health
        run: |
          echo "Waiting for backend to be ready..."
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8080/health > /dev/null 2>&1; then
              echo "✅ Backend is ready!"
              break
            fi
            echo "⏳ Waiting... ($i/60)"
            sleep 2
          done
          # Verify backend is actually responding
          curl -f http://localhost:8080/health || (echo "❌ Backend not ready after 120s" && exit 1)

      - name: Install Playwright browsers
        run: cd frontend && npx playwright install --with-deps chromium

      - name: Run E2E tests
        env:
          BASE_URL: http://localhost:3000
          BACKEND_URL: http://localhost:8080
        run: cd frontend && npm run e2e

      - name: Upload Playwright report (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

      - name: Upload test results (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-test-results
          path: frontend/test-results/
          retention-days: 7

      - name: Upload screenshots (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-screenshots
          path: frontend/test-results/**/*.png
          retention-days: 7

      - name: Cleanup Docker
        if: always()
        run: docker compose down -v

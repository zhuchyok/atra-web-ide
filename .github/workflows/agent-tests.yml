name: Agent Tests

on:
  push:
    paths:
      - "knowledge_os/app/expert_*.py"
      - "knowledge_os/app/agent_*.py"
      - "knowledge_os/app/ai_*.py"
      - "knowledge_os/app/services/blackboard_service.py"
  pull_request:
    paths:
      - "knowledge_os/app/expert_*.py"
      - "knowledge_os/app/agent_*.py"

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: secret
          POSTGRES_DB: knowledge_os_test
        ports:
          - 5432:5432
      redis:
        image: redis:7
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          pip install -r knowledge_os/requirements.txt
          pip install pytest pytest-asyncio
      - name: Run agent unit tests
        run: |
          python -m pytest -q --tb=line \
            knowledge_os/tests/test_a2a_protocol.py \
            knowledge_os/tests/test_code_sandbox.py \
            knowledge_os/tests/test_state_checkpoint.py \
            knowledge_os/tests/test_group_chat_state_machine.py
        env:
          DATABASE_URL: postgresql://admin:secret@localhost:5432/knowledge_os_test
          REDIS_URL: redis://localhost:6379
          PYTHONPATH: ${{ github.workspace }}/knowledge_os

name: Agent Tests

on:
  push:
    paths:
      - "knowledge_os/app/expert_*.py"
      - "knowledge_os/app/agent_*.py"
      - "knowledge_os/app/ai_*.py"
      - "knowledge_os/app/services/blackboard_service.py"
  pull_request:
    paths:
      - "knowledge_os/app/expert_*.py"
      - "knowledge_os/app/agent_*.py"

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: secret
          POSTGRES_DB: knowledge_os_test
        ports:
          - 5432:5432
      redis:
        image: redis:7
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          pip install -r knowledge_os/requirements.txt
          pip install pytest pytest-asyncio
      - name: Run agent unit tests
        run: |
          python -m pytest knowledge_os/tests/ -q --tb=line \
            -k "not test_e2e and not test_rest_api and not test_health_api" \
            --ignore=knowledge_os/tests/test_e2e.py \
            --ignore=knowledge_os/tests/test_rest_api.py \
            --ignore=knowledge_os/tests/test_health_api.py
        env:
          DATABASE_URL: postgresql://admin:secret@localhost:5432/knowledge_os_test
          REDIS_URL: redis://localhost:6379

# Contributors Tracking
# Based on FastAPI contributors workflow
# Automatically tracks and documents contributors

name: Contributors Tracking

on:
  schedule:
    # Run monthly (1st day at 3:00 UTC)
    - cron: "0 3 1 * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update-contributors:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Full history for accurate contributor stats

      - name: Generate contributors list
        run: |
          echo "# 👥 Contributors" > CONTRIBUTORS.md
          echo "" >> CONTRIBUTORS.md
          echo "Thank you to all the people who have contributed to ATRA Web IDE!" >> CONTRIBUTORS.md
          echo "" >> CONTRIBUTORS.md
          echo "## Core Team" >> CONTRIBUTORS.md
          echo "" >> CONTRIBUTORS.md
          echo "- [@bikos](https://github.com/bikos) - Project Lead" >> CONTRIBUTORS.md
          echo "" >> CONTRIBUTORS.md
          echo "## Contributors" >> CONTRIBUTORS.md
          echo "" >> CONTRIBUTORS.md

          # Get all contributors sorted by commits
          git log --format='%aN <%aE>' | sort -u | while read author; do
            name=$(echo "$author" | sed 's/ <.*//')
            email=$(echo "$author" | sed 's/.*<//;s/>.*//')
            commits=$(git log --author="$email" --oneline | wc -l | tr -d ' ')
            echo "- **$name** - $commits commits" >> CONTRIBUTORS.md
          done

          echo "" >> CONTRIBUTORS.md
          echo "---" >> CONTRIBUTORS.md
          echo "*This file is automatically generated on the 1st of each month.*" >> CONTRIBUTORS.md

      - name: Check for changes
        id: check_changes
        run: |
          if git diff --quiet CONTRIBUTORS.md; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push
        if: steps.check_changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add CONTRIBUTORS.md
          git commit -m "chore: update contributors list [skip ci]"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

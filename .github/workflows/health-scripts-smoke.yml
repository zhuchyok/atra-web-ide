name: Health Scripts Smoke

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  smoke:
    name: Script Contracts Smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Shell syntax check
        run: |
          bash -n scripts/check_all_services.sh
          bash -n scripts/check_all_services_enhanced.sh
          bash -n scripts/check_prometheus.sh
          bash -n scripts/check_ready.sh
          bash -n scripts/check_services.sh
          bash -n scripts/check_phase2.sh
          bash -n scripts/check_macbook_connection.sh
          bash -n scripts/check_and_start_containers.sh
          bash -n scripts/auto_start_containers.sh
          bash -n scripts/auto_setup_server.sh
          bash -n scripts/QUICK_SERVER_SETUP.sh
          bash -n scripts/system_auto_recovery.sh
          bash -n scripts/check_ready.sh
          bash -n scripts/do_everything_setup.sh
          bash -n scripts/auto_start_mac_studio.sh
          bash -n scripts/start_mac_studio_full.sh
          bash -n scripts/start_all_on_mac_studio.sh
          bash -n scripts/ensure_autonomous_systems.sh
          bash -n scripts/setup_system_auto_recovery.sh
          bash -n scripts/setup_docker_autostart.sh
          bash -n scripts/setup_mac_studio_docker.sh
          bash -n scripts/setup_complete_autostart.sh
          bash -n scripts/start_all_autonomous_systems.sh
          bash -n scripts/run_quality_pipeline.sh
          bash -n scripts/verify_full_recovery_readiness.sh
          bash -n scripts/verify_mac_studio_self_recovery.sh
          bash -n scripts/create_mac_studio_autostart.sh
          bash -n scripts/start_autonomous_systems.sh
          bash -n scripts/install_quality_cron.sh
          bash -n scripts/execute_all_tasks_on_mac_studio.sh
          bash -n scripts/final_victoria_setup.sh
          bash -n scripts/victoria/do_all_victoria_setup.sh
          bash -n scripts/victoria/victoria_auto_connect.sh
          bash -n scripts/setup_backup_launchd.sh
          bash -n scripts/AUTO_START_MLX.sh
          bash -n scripts/setup_router_port_forwarding.sh
          bash -n scripts/apply_changes_to_mac_studio.sh

      - name: Python syntax check
        run: |
          python -m py_compile scripts/task_hash.py
          python -m py_compile scripts/check_quality_thresholds.py

      - name: Script contract assertions
        run: |
          python - <<'PY'
          from pathlib import Path

          checks = {
              "scripts/check_all_services.sh": [
                  "set -euo pipefail",
                  "ERRORS=0",
                  "8002",
                  "8010",
                  "8011",
                  "9091",
                  "3002",
                  "exit 1",
              ],
              "scripts/check_all_services_enhanced.sh": [
                  "check_service_any",
                  "CHECK_LEGACY_MCP",
                  "victoria-agent",
                  "veronica-agent",
                  "9091",
              ],
              "scripts/check_prometheus.sh": [
                  "python -c \"import pytest\"",
                  "python -m pytest app/tests/test_prometheus_metrics.py",
                  "set -euo pipefail",
              ],
              "scripts/check_ready.sh": [
                  "STRICT_READY_DB",
                  "MOONDREAM_AVAILABLE",
                  "exit 1",
              ],
              "scripts/check_services.sh": [
                  "STRICT_CHECK_SERVICES",
                  "FAILURES=0",
                  "8002",
                  "CHECK_LEGACY_MCP",
              ],
              "scripts/check_phase2.sh": [
                  "set -e",
                  "grep -q",
              ],
              "scripts/check_macbook_connection.sh": [
                  "exit 1",
              ],
              "scripts/check_and_start_containers.sh": [
                  "HARD_FAIL",
                  "ensure_docker_network",
                  "ENABLE_NIGHTLY_AUTOSTART",
                  "ATRA_FORCE_PATH",
                  "exit $EXIT_CODE",
              ],
              "scripts/auto_start_containers.sh": [
                  "ensure_docker_network",
                  "knowledge_os_worker",
                  "knowledge_postgres",
                  "FAIL=0",
              ],
              "scripts/auto_setup_server.sh": [
                  "SETUP_FAIL",
                  "exit \"$SETUP_FAIL\"",
                  "8002",
                  "8010",
                  "8011",
                  "9091",
                  "3002",
                  "knowledge_postgres",
                  "knowledge_nightly",
              ],
              "scripts/QUICK_SERVER_SETUP.sh": [
                  "SETUP_FAIL",
                  "exit \"$SETUP_FAIL\"",
              ],
              "scripts/system_auto_recovery.sh": [
                  "RECOVERY_HARD_FAIL",
                  "compose_rc",
                  "verify_rc",
                  "run_compose_tracked",
                  "11434",
                  "REQUIRED_FINAL_SERVICES=4",
                  "Ollama brain",
                  "exit 1",
              ],
              "scripts/do_everything_setup.sh": [
                  "SETUP_FAIL",
                  "exit \"$SETUP_FAIL\"",
              ],
              "scripts/auto_start_mac_studio.sh": [
                  "compose_rc",
                  "exit $FAIL",
              ],
              "scripts/start_mac_studio_full.sh": [
                  "SETUP_FAIL",
                  "8002",
                  "exit \"$SETUP_FAIL\"",
              ],
              "scripts/start_all_on_mac_studio.sh": [
                  "8002",
                  "EXIT_CODE",
                  "exit \"$EXIT_CODE\"",
              ],
              "scripts/ensure_autonomous_systems.sh": [
                  "HARD_FAIL",
                  "knowledge_os_redis",
                  "exit \"$HARD_FAIL\"",
              ],
              "scripts/setup_system_auto_recovery.sh": [
                  "SETUP_FAIL",
                  "exit \"$SETUP_FAIL\"",
              ],
              "scripts/setup_docker_autostart.sh": [
                  "SETUP_FAIL",
                  "exit \"$SETUP_FAIL\"",
                  "hardened",
              ],
              "scripts/setup_mac_studio_docker.sh": [
                  "8002",
                  "11434",
                  "SERVICES_OK",
                  "exit \"$EXIT_CODE\"",
              ],
              "scripts/setup_complete_autostart.sh": [
                  "SETUP_FAIL",
                  "exit \"$SETUP_FAIL\"",
                  "ensure_autonomous_systems.sh",
              ],
              "scripts/start_all_autonomous_systems.sh": [
                  "HARD_FAIL",
                  "exit \"$HARD_FAIL\"",
                  "knowledge_os_orchestrator",
              ],
              "scripts/run_quality_pipeline.sh": [
                  "PIPELINE_FAIL",
                  "exit \"$PIPELINE_FAIL\"",
                  "passed\":false",
              ],
              "scripts/verify_full_recovery_readiness.sh": [
                  "FAIL=0",
                  "exit \"$FAIL\"",
                  "11434",
              ],
              "scripts/verify_mac_studio_self_recovery.sh": [
                  "CRITICAL_FAIL",
                  "CRITICAL_OK",
              ],
              "scripts/create_mac_studio_autostart.sh": [
                  "SETUP_FAIL",
                  "exit \"$SETUP_FAIL\"",
              ],
              "scripts/start_autonomous_systems.sh": [
                  "HARD_FAIL",
                  "exit \"$HARD_FAIL\"",
                  "knowledge_os_orchestrator",
              ],
              "scripts/install_quality_cron.sh": [
                  "SETUP_FAIL",
                  "exit \"$SETUP_FAIL\"",
                  "CRON_MARKER",
              ],
              "scripts/execute_all_tasks_on_mac_studio.sh": [
                  "HARD_FAIL",
                  "8002",
                  "11434",
                  "exit \"$HARD_FAIL\"",
              ],
              "scripts/nightly_routing_quality_guard.py": [
                  "hard_fail",
                  "return 2",
              ],
              "scripts/final_victoria_setup.sh": [
                  "SETUP_FAIL",
                  "exit \"$SETUP_FAIL\"",
                  "8010",
              ],
              "scripts/victoria/do_all_victoria_setup.sh": [
                  "SETUP_FAIL",
                  "exit \"$SETUP_FAIL\"",
                  "8010",
              ],
              "scripts/victoria/victoria_auto_connect.sh": [
                  "HARD_FAIL",
                  "exit \"$HARD_FAIL\"",
                  "8010",
              ],
              "scripts/setup_backup_launchd.sh": [
                  "SETUP_FAIL",
                  "exit \"$SETUP_FAIL\"",
              ],
              "scripts/AUTO_START_MLX.sh": [
                  "curl -sf",
                  "exit 1",
              ],
              "scripts/apply_changes_to_mac_studio.sh": [
                  "HARD_FAIL",
                  "11434",
                  "exit \"${HARD_FAIL:-0}\"",
              ],
          }

          for path, needles in checks.items():
              text = Path(path).read_text(encoding="utf-8")
              for needle in needles:
                  if needle not in text:
                      raise SystemExit(f"Missing contract marker '{needle}' in {path}")
          print("contract assertions passed")
          PY

      - name: task_hash smoke
        run: |
          python scripts/task_hash.py hash backend:test
          python scripts/task_hash.py changed HEAD

      - name: Runtime smoke - check_services exit contracts
        shell: bash
        run: |
          set -euo pipefail
          MOCK_DIR="$(mktemp -d)"
          mkdir -p "$MOCK_DIR/bin"
          export PATH="$MOCK_DIR/bin:$PATH"

          cat > "$MOCK_DIR/bin/curl" <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail
          url="${@: -1}"
          if [[ "${MOCK_FAIL_ONE:-0}" == "1" && "$url" == *"8011/health"* ]]; then
            exit 22
          fi
          if [[ "$url" == *"/api/tags"* ]]; then
            echo '{"models":[{"name":"mock-model","size":1000000000}]}'
          else
            echo "ok"
          fi
          exit 0
          EOF

          cat > "$MOCK_DIR/bin/docker" <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail
          if [[ "${1:-}" == "ps" ]]; then
            echo "NAMES STATUS PORTS"
            exit 0
          fi
          exit 0
          EOF

          chmod +x "$MOCK_DIR/bin/curl" "$MOCK_DIR/bin/docker"

          out_ok="$(mktemp)"
          STRICT_CHECK_SERVICES=true bash scripts/check_services.sh >"$out_ok" 2>&1
          grep -q "FAILURES=0" "$out_ok"

          out_fail="$(mktemp)"
          set +e
          MOCK_FAIL_ONE=1 STRICT_CHECK_SERVICES=true bash scripts/check_services.sh >"$out_fail" 2>&1
          rc=$?
          set -e
          test "$rc" -eq 1
          grep -q "FAILURES=" "$out_fail"

      - name: Runtime smoke - check_prometheus contracts
        shell: bash
        run: |
          set -euo pipefail
          MOCK_DIR="$(mktemp -d)"
          mkdir -p "$MOCK_DIR/bin"
          export PATH="$MOCK_DIR/bin:$PATH"

          cat > "$MOCK_DIR/bin/curl" <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail
          url="${@: -1}"

          if [[ "${PROM_FAIL_HEALTH:-0}" == "1" && "$url" == "http://localhost:8080/health" ]]; then
            exit 22
          fi

          case "$url" in
            http://localhost:8080/health)
              echo '{"status":"ok"}'
              ;;
            http://localhost:8080/metrics)
              echo 'requests_total 42'
              ;;
            http://localhost:8080/metrics/summary)
              echo '{"total":42}'
              ;;
            http://localhost:9091/api/v1/targets)
              echo '{"status":"success","data":{"activeTargets":[{"health":"up"}]}}'
              ;;
            http://localhost:3002/api/health|http://localhost:3001/api/health)
              echo '{"database":"ok"}'
              ;;
            *)
              echo "ok"
              ;;
          esac
          EOF

          # Force deterministic branch where pytest is skipped.
          cat > "$MOCK_DIR/bin/python" <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail
          if [[ "${1:-}" == "-c" ]]; then
            exit 1
          fi
          exec python3 "$@"
          EOF

          chmod +x "$MOCK_DIR/bin/curl" "$MOCK_DIR/bin/python"

          out_ok="$(mktemp)"
          bash scripts/check_prometheus.sh >"$out_ok" 2>&1
          grep -q "requests_total 42" "$out_ok"
          grep -q "Проверка завершена" "$out_ok"
          grep -q "pytest not run" "$out_ok"

          out_fail="$(mktemp)"
          set +e
          PROM_FAIL_HEALTH=1 bash scripts/check_prometheus.sh >"$out_fail" 2>&1
          rc=$?
          set -e
          test "$rc" -eq 1
          grep -q "Backend not running on 8080" "$out_fail"

      - name: Runtime smoke - task_hash exit contracts
        shell: bash
        run: |
          set -euo pipefail
          out_ok="$(python scripts/task_hash.py hash backend:test)"
          echo "$out_ok" | grep -q '"task_id": "backend:test"'
          echo "$out_ok" | grep -q '"hash":'

          set +e
          err="$(python scripts/task_hash.py changed __missing_ref__ 2>&1 >/dev/null)"
          rc=$?
          set -e
          test "$rc" -eq 2
          echo "$err" | grep -q "Base git ref does not exist"

      - name: Runtime smoke - quality thresholds fail-closed
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp)"
          echo '{"avg_metrics":{"faithfulness":0.9},"skipped":true}' >"$tmp"
          set +e
          python scripts/check_quality_thresholds.py "$tmp" --threshold faithfulness:0.8,relevance:0.85,coherence:0.7
          rc=$?
          set -e
          test "$rc" -eq 1

          echo '{"avg_metrics":{"faithfulness":0.9}}' >"$tmp"
          set +e
          python scripts/check_quality_thresholds.py "$tmp" --threshold faithfulness:0.8,relevance:0.85,coherence:0.7
          rc=$?
          set -e
          test "$rc" -eq 1

          echo '{"avg_metrics":{"faithfulness":0.9,"relevance":0.9,"coherence":0.8},"total_queries":3}' >"$tmp"
          python scripts/check_quality_thresholds.py "$tmp" --threshold faithfulness:0.8,relevance:0.85,coherence:0.7

          echo '{"avg_metrics":{"faithfulness":0.9,"relevance":0.9,"coherence":0.8},"total_queries":0}' >"$tmp"
          set +e
          python scripts/check_quality_thresholds.py "$tmp" --threshold faithfulness:0.8,relevance:0.85,coherence:0.7
          rc=$?
          set -e
          test "$rc" -eq 1

          python - <<'PY'
          import json, math, os, subprocess, tempfile
          fd, path = tempfile.mkstemp(suffix=".json")
          os.close(fd)
          with open(path, "w", encoding="utf-8") as fh:
              json.dump(
                  {
                      "avg_metrics": {
                          "faithfulness": float("nan"),
                          "relevance": 0.9,
                          "coherence": 0.8,
                      }
                  },
                  fh,
              )
          rc = subprocess.call(["python", "scripts/check_quality_thresholds.py", path])
          os.unlink(path)
          assert rc == 1, rc
          print("nan rejected")
          PY

      - name: Runtime smoke - QUICK_SERVER_SETUP fail-closed without docker
        shell: bash
        run: |
          set -euo pipefail
          MOCK_DIR="$(mktemp -d)"
          mkdir -p "$MOCK_DIR/bin"
          cat > "$MOCK_DIR/bin/docker" <<'EOF'
          #!/usr/bin/env bash
          exit 1
          EOF
          chmod +x "$MOCK_DIR/bin/docker"
          out="$(mktemp)"
          set +e
          env PATH="$MOCK_DIR/bin:/bin:/usr/bin" /bin/bash scripts/QUICK_SERVER_SETUP.sh >"$out" 2>&1
          rc=$?
          set -e
          test "$rc" -ne 0
          grep -Eqi 'Docker|daemon|не запущен' "$out"

      - name: Runtime smoke - check_all_services fail-closed
        shell: bash
        run: |
          set -euo pipefail
          MOCK_DIR="$(mktemp -d)"
          mkdir -p "$MOCK_DIR/bin"
          cat > "$MOCK_DIR/bin/curl" <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail
          url="${@: -1}"
          if [[ "$url" == *"8002"* ]]; then
            exit 22
          fi
          echo ok
          exit 0
          EOF
          cat > "$MOCK_DIR/bin/docker-compose" <<'EOF'
          #!/usr/bin/env bash
          if [[ "${1:-}" == "ps" ]]; then
            echo "NAME STATUS"
            exit 0
          fi
          if [[ "${1:-}" == "logs" ]]; then
            exit 0
          fi
          exit 0
          EOF
          chmod +x "$MOCK_DIR/bin/curl" "$MOCK_DIR/bin/docker-compose"
          out="$(mktemp)"
          set +e
          env PATH="$MOCK_DIR/bin:/bin:/usr/bin" /bin/bash scripts/check_all_services.sh >"$out" 2>&1
          rc=$?
          set -e
          test "$rc" -eq 1
          grep -q "Найдено проблем" "$out"

      - name: Runtime smoke - auto_setup_server fail-closed without docker
        shell: bash
        run: |
          set -euo pipefail
          MOCK_DIR="$(mktemp -d)"
          mkdir -p "$MOCK_DIR/bin" "$MOCK_DIR/home/bin"
          cat > "$MOCK_DIR/bin/docker" <<'EOF'
          #!/usr/bin/env bash
          exit 1
          EOF
          cat > "$MOCK_DIR/bin/crontab" <<'EOF'
          #!/usr/bin/env bash
          exit 0
          EOF
          chmod +x "$MOCK_DIR/bin/docker" "$MOCK_DIR/bin/crontab"
          # auto_setup needs docker-compose.yml at ROOT; repo has it.
          out="$(mktemp)"
          set +e
          env PATH="$MOCK_DIR/bin:/bin:/usr/bin" HOME="$MOCK_DIR/home" \
            /bin/bash scripts/auto_setup_server.sh >"$out" 2>&1
          rc=$?
          set -e
          test "$rc" -ne 0
          grep -Eqi 'Docker|daemon|ошибк' "$out"

      - name: Runtime smoke - check_and_start_containers fail-closed without docker
        shell: bash
        run: |
          set -euo pipefail
          MOCK_DIR="$(mktemp -d)"
          mkdir -p "$MOCK_DIR/bin"
          cat > "$MOCK_DIR/bin/docker" <<'EOF'
          #!/usr/bin/env bash
          exit 127
          EOF
          chmod +x "$MOCK_DIR/bin/docker"
          # Force test PATH so script does not prepend real Docker Desktop bins.
          out="$(mktemp)"
          set +e
          ATRA_FORCE_PATH="$MOCK_DIR/bin:/bin:/usr/bin" /bin/bash scripts/check_and_start_containers.sh >"$out" 2>&1
          rc=$?
          set -e
          test "$rc" -ne 0
          grep -Eqi 'Docker|daemon|не найден|не запущен' "$out"

      - name: Runtime smoke - start_all_autonomous fail-closed without docker
        shell: bash
        run: |
          set -euo pipefail
          MOCK_DIR="$(mktemp -d)"
          mkdir -p "$MOCK_DIR/bin"
          cat > "$MOCK_DIR/bin/docker" <<'EOF'
          #!/usr/bin/env bash
          exit 1
          EOF
          chmod +x "$MOCK_DIR/bin/docker"
          out="$(mktemp)"
          set +e
          env PATH="$MOCK_DIR/bin:/bin:/usr/bin" /bin/bash scripts/start_all_autonomous_systems.sh >"$out" 2>&1
          rc=$?
          set -e
          test "$rc" -ne 0
          grep -Eqi 'Docker|не запущен' "$out"

      - name: Runtime smoke - setup_mac_studio_docker fail-closed on dead services
        shell: bash
        run: |
          set -euo pipefail
          MOCK_DIR="$(mktemp -d)"
          mkdir -p "$MOCK_DIR/bin"
          cat > "$MOCK_DIR/bin/docker" <<'EOF'
          #!/usr/bin/env bash
          # Pretend daemon ok for early checks; services still fail via curl
          case "${1:-}" in
            info|version|ps) exit 0 ;;
            compose|*) exit 0 ;;
          esac
          EOF
          cat > "$MOCK_DIR/bin/docker-compose" <<'EOF'
          #!/usr/bin/env bash
          exit 0
          EOF
          cat > "$MOCK_DIR/bin/curl" <<'EOF'
          #!/usr/bin/env bash
          exit 22
          EOF
          chmod +x "$MOCK_DIR/bin/docker" "$MOCK_DIR/bin/docker-compose" "$MOCK_DIR/bin/curl"
          # Script may call real docker early; if compose file missing it exits 1; if services fail EXIT_CODE=1
          out="$(mktemp)"
          set +e
          env PATH="$MOCK_DIR/bin:/bin:/usr/bin" ATRA_SETUP_WAIT_SEC=0 \
            /bin/bash scripts/setup_mac_studio_docker.sh >"$out" 2>&1
          rc=$?
          set -e
          test "$rc" -ne 0

      - name: Runtime smoke - quality_ab_test winner fail-closed
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import importlib.util
          from pathlib import Path
          path = Path("backend/app/services/quality_ab_test.py")
          spec = importlib.util.spec_from_file_location("quality_ab_test", path)
          mod = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(mod)
          ab = mod.QualityABTest(results_path="/tmp/atra_ab_empty_round13.json")
          assert ab.get_winner("reranking_method") is None
          ab.track_result("reranking_method", "hybrid", {"relevance": 0.9})
          assert ab.get_winner("reranking_method") == "hybrid"
          print("ab winner fail-closed ok")
          PY

      - name: Runtime smoke - start_autonomous_systems fail-closed without docker
        shell: bash
        run: |
          set -euo pipefail
          MOCK_DIR="$(mktemp -d)"
          mkdir -p "$MOCK_DIR/bin"
          cat > "$MOCK_DIR/bin/docker" <<'EOF'
          #!/usr/bin/env bash
          exit 1
          EOF
          chmod +x "$MOCK_DIR/bin/docker"
          out="$(mktemp)"
          set +e
          env PATH="$MOCK_DIR/bin:/bin:/usr/bin" /bin/bash scripts/start_autonomous_systems.sh >"$out" 2>&1
          rc=$?
          set -e
          test "$rc" -ne 0
          grep -Eqi 'Docker|не запущен' "$out"

      - name: Runtime smoke - install_quality_cron fail-closed
        shell: bash
        run: |
          set -euo pipefail
          MOCK_DIR="$(mktemp -d)"
          mkdir -p "$MOCK_DIR/bin"
          cat > "$MOCK_DIR/bin/crontab" <<'EOF'
          #!/usr/bin/env bash
          exit 1
          EOF
          chmod +x "$MOCK_DIR/bin/crontab"
          out="$(mktemp)"
          set +e
          env PATH="$MOCK_DIR/bin:/bin:/usr/bin" /bin/bash scripts/install_quality_cron.sh >"$out" 2>&1
          rc=$?
          set -e
          test "$rc" -ne 0
          grep -Eqi 'crontab|Не удалось' "$out"

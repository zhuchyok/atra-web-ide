# CI/CD Task Caching (Turbo patterns)
name: CI Caching & Change Detection

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      changed_packages: ${{ steps.check.outputs.packages }}
      affected_tasks: ${{ steps.check.outputs.tasks }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check changed packages and tasks
        id: check
        run: |
          # Динамическая база сравнения: PR base SHA или push before SHA.
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          else
            BASE="${{ github.event.before }}"
          fi
          if [ -z "$BASE" ]; then
            echo "Empty BASE SHA for change detection"
            exit 1
          fi
          git cat-file -e "$BASE^{commit}"
          RESULT=$(python scripts/task_hash.py changed "$BASE")
          echo "packages=$(echo $RESULT | jq -c '.changed_packages')" >> $GITHUB_OUTPUT
          echo "tasks=$(echo $RESULT | jq -c '.affected_tasks')" >> $GITHUB_OUTPUT

          echo "Base SHA: $BASE"
          echo "Changed packages: $(echo $RESULT | jq -r '.changed_packages | join(", ")')"
          echo "Affected tasks: $(echo $RESULT | jq -r '.affected_tasks | join(", ")')"

  run-tasks:
    needs: detect-changes
    runs-on: ubuntu-latest
    if: needs.detect-changes.outputs.changed_packages != '[]'
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Run affected tasks
        run: |
          TASKS='${{ needs.detect-changes.outputs.affected_tasks }}'
          # Fail fast on unknown task ids to avoid false-green no-op runs.
          for task in $(echo $TASKS | jq -r '.[]'); do
            echo "Running task: $task"
            case "$task" in
              rust_core:build)
                cargo build --workspace
                ;;
              rust_core:test)
                cargo test --workspace
                ;;
              knowledge_os:lint)
                # Lean: ruff only — full requirements.txt pulls torch via sentence-transformers.
                python -m pip install --upgrade pip
                python -m pip install ruff
                python -m ruff check knowledge_os/
                ;;
              knowledge_os:test)
                # Prefer lean test deps (still heavy; avoids browser-use/moondream).
                python -m pip install --upgrade pip
                python -m pip install -r knowledge_os/requirements-test.txt
                python -m pytest knowledge_os/tests/ -q \
                  -k "not benchmark and not live" \
                  --ignore=knowledge_os/tests/test_e2e.py \
                  --ignore=knowledge_os/tests/test_security.py \
                  --ignore=knowledge_os/tests/test_performance_benchmarks.py \
                  --ignore=knowledge_os/tests/test_live_chain.py \
                  --ignore=knowledge_os/tests/test_integration_bridge.py \
                  --ignore=knowledge_os/tests/test_actor_event_sourcing.py \
                  --ignore=knowledge_os/tests/test_knowledge_graph.py \
                  --ignore=knowledge_os/tests/test_load.py \
                  --ignore=knowledge_os/tests/test_red_team_auditor.py \
                  --ignore=knowledge_os/tests/test_deep_memory.py \
                  --ignore=knowledge_os/tests/test_rest_api.py \
                  --ignore=knowledge_os/tests/test_victoria_chat_and_request.py
                ;;
              frontend:build)
                cd frontend && npm ci && npm run build && cd ..
                ;;
              frontend:test)
                cd frontend && npm ci && npm run test -- --run && cd ..
                ;;
              backend:test)
                python -m pip install -r backend/requirements-dev.txt
                cd backend && python -m pytest app/tests -q && cd ..
                ;;
              *)
                echo "Unknown affected task: $task"
                exit 1
                ;;
            esac
          done

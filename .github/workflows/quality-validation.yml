# Фаза 4: проверка качества RAG при изменениях и по расписанию
# PR/push/schedule on GitHub-hosted: reference_smoke / local_smoke (offline extract) — NOT live retrieval.
# LIVE RAG: Mac Studio host (`./scripts/run_live_rag_quality.sh`) or workflow_dispatch with live_rag=true
# (fail-closed if Ollama/Postgres missing — never silent green).
name: Quality Validation

on:
  schedule:
    - cron: "0 2 * * *" # Каждый день в 2:00 UTC
  workflow_dispatch:
    inputs:
      live_rag:
        description: "Run LIVE RAG quality (needs Ollama+Postgres on the runner; fail-closed if missing)"
        type: boolean
        default: false
      # Prefer Mac Studio host script for real live scores. GH-hosted without
      # Ollama+DB must fail closed (proves honesty). Use a self-hosted label only
      # when that runner actually has Ollama+Postgres.
      runner:
        description: "Runner for LIVE job (ubuntu-latest fails closed without services; or self-hosted)"
        type: choice
        options:
          - ubuntu-latest
          - self-hosted
        default: ubuntu-latest
  push:
    branches: [main]
    paths: &quality_paths
      - "backend/app/services/rag_light.py"
      - "backend/app/services/reranking.py"
      - "backend/app/services/query_rewriter.py"
      - "backend/app/services/query_expansion.py"
      - "backend/app/services/knowledge_os.py"
      - "backend/app/services/embedding_fallback.py"
      - "backend/app/services/embedding_batch.py"
      - "backend/app/services/rag_light_prefetch.py"
      - "backend/app/services/rag_context_cache.py"
      - "backend/app/services/query_classifier.py"
      - "backend/app/services/latency_tracer.py"
      - "backend/app/config.py"
      - "backend/app/evaluation/**"
      - "backend/app/services/validation_pipeline.py"
      - "data/validation_queries.json"
      - "scripts/evaluate_rag_quality.py"
      - "scripts/check_quality_thresholds.py"
      - "scripts/run_live_rag_quality.sh"
      - "scripts/benchmark_latency.py"
      - ".github/workflows/quality-validation.yml"
  pull_request:
    paths: *quality_paths

jobs:
  validate-quality:
    # Offline smoke stays the default PR/push/schedule gate (no fake live scores).
    if: github.event_name != 'workflow_dispatch' || inputs.live_rag != true
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: secret
          POSTGRES_DB: knowledge_os
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          cd backend
          pip install -r requirements.txt
          pip install pytest pytest-asyncio

      - name: Wait for Postgres
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y postgresql-client
          for i in $(seq 1 30); do
            if pg_isready -h localhost -p 5432 -U admin; then
              exit 0
            fi
            sleep 2
          done
          echo "Postgres did not become ready"
          exit 1

      - name: Run quality validation
        env:
          DATABASE_URL: postgresql://admin:secret@localhost:5432/knowledge_os
          RERANKING_ENABLED: "true"
        run: |
          set -euo pipefail
          export PYTHONPATH="$PWD/backend:$PWD"
          if [ ! -f data/validation_queries.json ]; then
            # Fail-closed even on schedule: empty/skipped stub must not green the job
            echo "validation dataset missing for ${{ github.event_name }}: data/validation_queries.json"
            exit 1
          fi
          # GitHub-hosted runners have no Ollama/seeded KB. Live mode yields zeros (honest fail).
          # reference_smoke: real evaluator metrics over extract_direct_answer(Q/A chunk) — labeled, not live RAG.
          python scripts/evaluate_rag_quality.py \
            --mode reference_smoke \
            --dataset data/validation_queries.json \
            --threshold faithfulness:0.8,relevance:0.85,coherence:0.7 \
            --output backend/validation_report.json \
            --timeout-per-query 5 \
            --verbose 2>&1 | tee backend/validation_output.txt
          test -f backend/validation_report.json
          python3 -c 'import json,sys; d=json.load(open("backend/validation_report.json")); assert d.get("mode")=="reference_smoke", d; assert d.get("skipped") is not True; assert int(d.get("total_queries") or 0)>=1'

      - name: Upload validation report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validation-report
          path: |
            backend/validation_report.json
            backend/validation_output.txt

      - name: Check quality thresholds
        run: |
          set -euo pipefail
          test -f scripts/check_quality_thresholds.py
          test -f backend/validation_report.json
          if python3 -c 'import json,sys; sys.exit(0 if json.load(open("backend/validation_report.json")).get("skipped") is True else 1)'; then
            echo "Skipped report is not allowed (fail-closed for all events including schedule)"
            exit 1
          fi
          python scripts/check_quality_thresholds.py backend/validation_report.json --threshold faithfulness:0.8,relevance:0.85,coherence:0.7

      - name: Latency benchmark
        env:
          DATABASE_URL: postgresql://admin:secret@localhost:5432/knowledge_os
          EMBEDDING_FALLBACK_ENABLED: "true"
        run: |
          set -euo pipefail
          export PYTHONPATH="$PWD/backend:$PWD"
          # local_smoke: offline extract path (no Ollama). Labeled in latency_benchmark.json.
          python scripts/benchmark_latency.py --mode local_smoke 2>&1 | tee backend/latency_output.txt
          if [ ! -f latency_benchmark.json ] || [ ! -s latency_benchmark.json ]; then
            echo "latency_benchmark.json missing or empty after benchmark"
            exit 1
          fi
          echo "Latency results:"
          python3 -c "import json; d=json.load(open('latency_benchmark.json')); print('  mode:', d.get('mode')); print('  P95:', d.get('p95_ms','?'), 'ms'); print('  P50:', d.get('p50_ms','?'), 'ms')"
          python3 -c 'import json; d=json.load(open("latency_benchmark.json")); assert d.get("mode")=="local_smoke", d; assert isinstance(d, dict) and d and "p95_ms" in d and isinstance(d["p95_ms"], (int, float)), d'

      - name: Upload latency report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: latency-report
          path: |
            latency_benchmark.json
            backend/latency_output.txt

  # LIVE retrieval — only via workflow_dispatch(live_rag=true).
  # On GitHub-hosted runners without Ollama+seeded KB this MUST fail closed (exit 1), never skip green.
  # Preferred host path: LIVE_RAG_QUALITY=1 ./scripts/run_live_rag_quality.sh (Mac Studio).
  validate-quality-live:
    if: github.event_name == 'workflow_dispatch' && inputs.live_rag == true
    runs-on: ${{ inputs.runner || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          cd backend
          pip install -r requirements.txt

      - name: LIVE RAG quality (fail-closed)
        env:
          LIVE_RAG_QUALITY: "1"
          LIVE_RAG_REQUIRE_NOMIC: "1"
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          OLLAMA_URL: ${{ secrets.OLLAMA_URL }}
          RERANKING_ENABLED: "false"
        run: |
          set -euo pipefail
          export PYTHONPATH="$PWD/backend:$PWD"
          export DATABASE_URL="${DATABASE_URL:-postgresql://admin:secret@localhost:5432/knowledge_os}"
          # Hands/embed Ollama (nomic). Brain :11434 without nomic must fail closed.
          export OLLAMA_URL="${OLLAMA_URL:-http://127.0.0.1:11437}"
          mkdir -p logs
          if [ ! -f data/validation_queries.json ]; then
            echo "validation dataset missing"
            exit 1
          fi
          # No silent skip: evaluate_rag_quality --mode live preflights Ollama+DB(+nomic) and exits 1 if missing.
          python scripts/evaluate_rag_quality.py \
            --mode live \
            --require-live \
            --limit "${RAG_LIVE_LIMIT:-20}" \
            --dataset data/validation_queries.json \
            --threshold faithfulness:0.8,relevance:0.85,coherence:0.7 \
            --output logs/rag_quality_live.json \
            --timeout-per-query 30 \
            --verbose 2>&1 | tee logs/rag_quality_live_output.txt
          test -f logs/rag_quality_live.json
          python3 -c 'import json,sys; d=json.load(open("logs/rag_quality_live.json")); assert d.get("mode")=="live", d; assert d.get("skipped") is not True; assert int(d.get("total_queries") or 0)>=1'
          python scripts/check_quality_thresholds.py logs/rag_quality_live.json \
            --require-mode live \
            --threshold faithfulness:0.8,relevance:0.85,coherence:0.7

      - name: Upload LIVE validation report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validation-report-live
          path: |
            logs/rag_quality_live.json
            logs/rag_quality_live_output.txt

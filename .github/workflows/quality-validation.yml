# Фаза 4: проверка качества RAG при изменениях и по расписанию
name: Quality Validation

on:
  schedule:
    - cron: "0 2 * * *" # Каждый день в 2:00 UTC
  push:
    branches: [main]
    paths: &quality_paths
      - "backend/app/services/rag_light.py"
      - "backend/app/services/reranking.py"
      - "backend/app/services/query_rewriter.py"
      - "backend/app/services/query_expansion.py"
      - "backend/app/services/knowledge_os.py"
      - "backend/app/services/embedding_fallback.py"
      - "backend/app/services/embedding_batch.py"
      - "backend/app/services/rag_light_prefetch.py"
      - "backend/app/services/rag_context_cache.py"
      - "backend/app/services/query_classifier.py"
      - "backend/app/services/latency_tracer.py"
      - "backend/app/config.py"
      - "backend/app/evaluation/**"
      - "backend/app/services/validation_pipeline.py"
      - "data/validation_queries.json"
      - "scripts/evaluate_rag_quality.py"
      - "scripts/check_quality_thresholds.py"
      - "scripts/benchmark_latency.py"
      - ".github/workflows/quality-validation.yml"
  pull_request:
    paths: *quality_paths

jobs:
  validate-quality:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: secret
          POSTGRES_DB: knowledge_os
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          cd backend
          pip install -r requirements.txt
          pip install pytest pytest-asyncio

      - name: Wait for Postgres
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y postgresql-client
          for i in $(seq 1 30); do
            if pg_isready -h localhost -p 5432 -U admin; then
              exit 0
            fi
            sleep 2
          done
          echo "Postgres did not become ready"
          exit 1

      - name: Run quality validation
        env:
          DATABASE_URL: postgresql://admin:secret@localhost:5432/knowledge_os
          RERANKING_ENABLED: "true"
        run: |
          export PYTHONPATH="$PWD/backend:$PWD"
          if [ ! -f data/validation_queries.json ]; then
            # Fail-closed even on schedule: empty/skipped stub must not green the job
            echo "validation dataset missing for ${{ github.event_name }}: data/validation_queries.json"
            exit 1
          fi
          python scripts/evaluate_rag_quality.py \
            --dataset data/validation_queries.json \
            --threshold faithfulness:0.8,relevance:0.85,coherence:0.7 \
            --output backend/validation_report.json \
            --timeout-per-query 5 \
            --verbose 2>&1 | tee backend/validation_output.txt
          test -f backend/validation_report.json

      - name: Upload validation report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validation-report
          path: |
            backend/validation_report.json
            backend/validation_output.txt

      - name: Check quality thresholds
        run: |
          test -f scripts/check_quality_thresholds.py
          test -f backend/validation_report.json
          if python3 -c 'import json,sys; sys.exit(0 if json.load(open("backend/validation_report.json")).get("skipped") is True else 1)'; then
            echo "Skipped report is not allowed (fail-closed for all events including schedule)"
            exit 1
          fi
          python scripts/check_quality_thresholds.py backend/validation_report.json --threshold faithfulness:0.8,relevance:0.85,coherence:0.7

      - name: Latency benchmark
        env:
          DATABASE_URL: postgresql://admin:secret@localhost:5432/knowledge_os
          EMBEDDING_FALLBACK_ENABLED: "true"
        run: |
          set -euo pipefail
          export PYTHONPATH="$PWD/backend:$PWD"
          # Fail-closed for all events (incl. schedule): no --no-fail, no || true.
          python scripts/benchmark_latency.py 2>&1 | tee backend/latency_output.txt
          if [ ! -f latency_benchmark.json ] || [ ! -s latency_benchmark.json ]; then
            echo "latency_benchmark.json missing or empty after benchmark"
            exit 1
          fi
          echo "Latency results:"
          python3 -c "import json; d=json.load(open('latency_benchmark.json')); print('  P95:', d.get('p95_ms','?'), 'ms'); print('  P50:', d.get('p50_ms','?'), 'ms')"
          python3 -c 'import json; d=json.load(open("latency_benchmark.json")); assert isinstance(d, dict) and d and "p95_ms" in d and isinstance(d["p95_ms"], (int, float)), d'

      - name: Upload latency report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: latency-report
          path: |
            latency_benchmark.json
            backend/latency_output.txt

name: CI — Regression Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: secret
          POSTGRES_DB: knowledge_os
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-asyncio pyyaml
          pip install -r knowledge_os/requirements.txt

      - name: Init schema + migrations
        env:
          PGPASSWORD: secret
          DATABASE_URL: postgresql://admin:secret@localhost:5432/knowledge_os
          PYTHONPATH: ${{ github.workspace }}
        run: |
          sudo apt-get update && sudo apt-get install -y postgresql-client
          psql -h localhost -p 5432 -U admin -d knowledge_os -f knowledge_os/db/init.sql
          python knowledge_os/scripts/apply_migrations.py

      - name: Run unit tests
        env:
          DATABASE_URL: postgresql://admin:secret@localhost:5432/knowledge_os
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python -m pytest knowledge_os/tests/ \
            --ignore=knowledge_os/tests/test_e2e.py \
            --ignore=knowledge_os/tests/test_security.py \
            --ignore=knowledge_os/tests/test_performance_benchmarks.py \
            --ignore=knowledge_os/tests/test_live_chain.py \
            --ignore=knowledge_os/tests/test_integration_bridge.py \
            -k "not benchmark and not live and not integration" \
            -v --tb=short --junitxml=test-results/junit.xml

      - name: Enforce minimum test count
        run: python scripts/ci_check_test_count.py

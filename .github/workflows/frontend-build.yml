name: Frontend Build Check

# Ловит сломанную сборку фронтенда (битые импорты, отсутствующие файлы,
# сломанный svelte/vite-конфиг) до того, как она попадёт в main.
# Инцидент 09.2026: App.svelte удалили, сборка молча умерла.

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-build.yml"
  pull_request:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-build.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build (vite build)
        working-directory: frontend
        run: npm run build

      - name: Check bundle exists
        working-directory: frontend
        run: |
          test -d dist && test -n "$(ls dist/assets/*.js 2>/dev/null)" || {
            echo "::error::dist/assets/*.js не найден — сборка пустая"
            exit 1
          }
          echo "Bundle OK: $(ls dist/assets | head -5 | tr '\n' ' ')"

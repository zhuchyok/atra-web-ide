[advisories]
# Осознанные игноры: cargo audit --deny warnings в CI требует нуля уязвимостей.
# После миграции sqlx 0.8 sqlx/rustls/sqlite-цепочка очищена; оставляем только актуальное.
ignore = [
    # sqlx 0.8 currently resolves rsa 0.9.x transitively.
    # Fix requires upstream dependency graph move to rsa >= 0.10.
    "RUSTSEC-2023-0071",
    # sqlx 0.8 currently resolves libsqlite3-sys 0.30.x.
    # Fixed in >= 0.39, which requires newer sqlx chain (tracked separately).
    "RUSTSEC-2026-0459",
    # Transitive unmaintained crates currently required by dependency graph.
    "RUSTSEC-2025-0057",
    "RUSTSEC-2025-0134",
    # dotenv: unmaintained, замена на dotenvy запланирована отдельно.
    "RUSTSEC-2021-0141",
]

# setki21.ru -> https://www.setki21.ru
server {
  listen 80;
  listen [::]:80;
  server_name setki21.ru;
  include conf.d/include/letsencrypt-acme-challenge.conf;
  location / {
    return 301 https://www.setki21.ru$request_uri;
  }
}
# HTTPS: редирект (включить после получения серта: certbot ... setki21.ru, затем перезалить этот файл и reload)
server {
  listen 443 ssl;
  listen [::]:443 ssl;
  server_name setki21.ru;
  include conf.d/include/ssl-cache.conf;
  include conf.d/include/ssl-ciphers.conf;
  ssl_certificate /etc/letsencrypt/live/npm-2/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/npm-2/privkey.pem;
  location / {
    return 301 https://www.setki21.ru$request_uri;
  }
}

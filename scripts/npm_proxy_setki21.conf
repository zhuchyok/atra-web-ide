# NPM proxy for www.setki21.ru -> setki21-site (created manually, NPM did not write file)
map $scheme $hsts_header {
    https   "max-age=63072000; preload";
}
server {
  set $forward_scheme http;
  set $server         "setki21-site";
  set $port           80;
  listen 80;
  listen [::]:80;
  listen 443 ssl;
  listen [::]:443 ssl;
  server_name www.setki21.ru;
  http2 on;
  include conf.d/include/letsencrypt-acme-challenge.conf;
  include conf.d/include/ssl-cache.conf;
  include conf.d/include/ssl-ciphers.conf;
  ssl_certificate /etc/letsencrypt/live/npm-1/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/npm-1/privkey.pem;
  add_header Strict-Transport-Security $hsts_header always;
  set $trust_forwarded_proto "F";
  include conf.d/include/force-ssl.conf;
  access_log /data/logs/proxy-host-1_access.log proxy;
  error_log /data/logs/proxy-host-1_error.log warn;
  location /health {
    set $server moskit-api;
    set $port 8080;
    include conf.d/include/proxy.conf;
  }
  # Заявки с формы заказа — отдельный сервис orders-api (письмо на info@setki21.ru). Контейнер в сети atra-network.
  location /api/orders {
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Scheme $scheme;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_pass http://setki21-orders-api:3010;
  }
  location /api {
    set $server moskit-api;
    set $port 8080;
    include conf.d/include/proxy.conf;
  }
  location / {
    include conf.d/include/proxy.conf;
  }
  include /data/nginx/custom/server_proxy[.]conf;
}
